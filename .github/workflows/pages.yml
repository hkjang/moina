name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "VERSION"
      - "docs/**"
      - "scripts/qa-pages.mjs"
      - "scripts/check-brand-colors.mjs"
      - "e2e/pages-*.mjs"
      - "e2e/package.json"
      - "e2e/package-lock.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Validate and publish docs
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Brand, contrast, SEO, AEO and link checks
        run: |
          set -Eeuo pipefail
          node scripts/check-brand-colors.mjs
          MOINA_REQUIRE_SCREENSHOTS=1 node scripts/qa-pages.mjs

      - name: Browser test desktop and mobile
        run: |
          set -Eeuo pipefail
          npm ci --prefix e2e
          npm --prefix e2e exec -- playwright install --with-deps chromium
          npm --prefix e2e run serve:pages > /tmp/moina-pages.log 2>&1 &
          server_pid=$!
          trap 'kill "${server_pid}" >/dev/null 2>&1 || true' EXIT
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:4173/ >/dev/null && break
            if [[ "${attempt}" -eq 30 ]]; then cat /tmp/moina-pages.log; exit 1; fi
            sleep 1
          done
          npm --prefix e2e run test:pages

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
