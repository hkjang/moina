openapi: 3.1.0
info:
  title: MOINA API
  version: 0.1.2
  summary: AI 소셜 지식 네트워크 REST·SSE·MCP API
  description: |
    서버에 실제 등록된 canonical route 계약입니다. 브라우저 session 또는 개인 API/MCP key로 인증합니다.
    Cookie 인증의 unsafe 요청은 `moina_csrf` cookie와 같은 `X-CSRF-Token` header가 필요합니다.
    Flow cursor는 versioned Base64 URL opaque keyset이므로 client가 해석하거나 조작하지 않습니다.
    For Me cursor는 사용자와 랭킹 버전에 결합된 서버 ranking snapshot ID를 포함합니다.
    Snapshot은 최대 1시간 유효하지만 사용자당 활성 3개 제한으로 더 일찍 만료될 수 있습니다.
  license: {name: MIT, identifier: MIT}
  contact: {name: MOINA, url: 'https://github.com/hkjang/moina'}
servers:
  - {url: '/', description: 같은 origin}
tags:
  - {name: System}
  - {name: Auth}
  - {name: Feed}
  - {name: Posts}
  - {name: Social}
  - {name: Profile}
  - {name: Discovery}
  - {name: Notifications}
  - {name: Moims}
  - {name: Governance}
  - {name: AI}
  - {name: Admin}
  - {name: MCP}
paths:
  /healthz:
    get:
      tags: [System]
      summary: 프로세스 상태
      security: []
      responses: {'200': {$ref: '#/components/responses/Health'}}
  /readyz:
    get:
      tags: [System]
      summary: PostgreSQL 준비 상태
      security: []
      responses: {'200': {$ref: '#/components/responses/Ready'}, '503': {$ref: '#/components/responses/Error'}}
  /metrics:
    get:
      tags: [System]
      summary: Prometheus 운영 지표
      description: 사용자·본문·SQL문을 label로 내보내지 않습니다. 공개 인터넷이 아닌 운영 수집망에서만 사용합니다.
      security: []
      responses: {'200': {$ref: '#/components/responses/Metrics'}}
  /api/v1/version:
    get:
      tags: [System]
      summary: 서비스 버전
      security: []
      responses: {'200': {$ref: '#/components/responses/Version'}}
  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: 로컬 로그인
      security: []
      requestBody: {$ref: '#/components/requestBodies/Login'}
      responses: {'200': {$ref: '#/components/responses/CurrentUser'}, '401': {$ref: '#/components/responses/Error'}, '429': {$ref: '#/components/responses/Error'}}
  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: 관리자가 허용한 로컬 가입
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegisterInput'}
      responses: {'201': {$ref: '#/components/responses/CurrentUser'}, '403': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}}
  /api/v1/auth/oidc/status:
    get:
      tags: [Auth]
      summary: OIDC 활성화와 로그인 URL
      security: []
      responses: {'200': {$ref: '#/components/responses/Data'}}
  /api/v1/auth/oidc/login:
    get:
      tags: [Auth]
      summary: Authorization Code + PKCE 시작
      security: []
      parameters:
        - {name: returnTo, in: query, schema: {type: string, pattern: '^/'}}
      responses: {'302': {description: OIDC provider로 이동}, '404': {$ref: '#/components/responses/Error'}}
  /api/v1/auth/oidc/callback:
    get:
      tags: [Auth]
      summary: OIDC callback
      security: []
      parameters:
        - {name: code, in: query, required: true, schema: {type: string}}
        - {name: state, in: query, required: true, schema: {type: string}}
      responses: {'302': {description: 원래 앱 경로로 이동}, '400': {$ref: '#/components/responses/Error'}}
  /api/v1/auth/me:
    get:
      tags: [Auth]
      summary: 현재 사용자와 유효 권한
      responses: {'200': {$ref: '#/components/responses/CurrentUser'}, '401': {$ref: '#/components/responses/Error'}}
  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: session 종료
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      responses: {'204': {$ref: '#/components/responses/NoContent'}, '403': {$ref: '#/components/responses/Error'}}
  /api/v1/feed:
    get:
      tags: [Feed]
      summary: For Me 또는 Following feed
      description: |
        For Me 첫 페이지 snapshot 생성이 같은 사용자 요청과 겹치면
        `feed_snapshot_busy`, HTTP 429와 `Retry-After: 1`을 반환합니다.
      parameters:
        - {name: mode, in: query, schema: {type: string, enum: [for_me, following], default: for_me}}
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
      responses: {'200': {$ref: '#/components/responses/PostPage'}, '400': {$ref: '#/components/responses/Error'}, '429': {$ref: '#/components/responses/FeedSnapshotBusy'}}
  /api/v1/flows/{mode}:
    get:
      tags: [Feed]
      summary: 브랜드 언어 feed alias
      description: |
        For Me 첫 페이지 snapshot 생성이 같은 사용자 요청과 겹치면
        `feed_snapshot_busy`, HTTP 429와 `Retry-After: 1`을 반환합니다.
      parameters:
        - {name: mode, in: path, required: true, schema: {type: string, enum: [for_me, following]}}
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
      responses: {'200': {$ref: '#/components/responses/PostPage'}, '400': {$ref: '#/components/responses/Error'}, '429': {$ref: '#/components/responses/FeedSnapshotBusy'}}
  /api/v1/posts:
    get:
      tags: [Posts]
      summary: Moin 목록
      parameters: [{$ref: '#/components/parameters/Offset'}, {$ref: '#/components/parameters/Limit'}]
      responses: {'200': {$ref: '#/components/responses/PostPage'}}
    post:
      tags: [Posts]
      summary: Moin 또는 Echo 작성
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      requestBody: {$ref: '#/components/requestBodies/CreatePost'}
      responses: {'201': {$ref: '#/components/responses/Post'}, '400': {$ref: '#/components/responses/Error'}}
  /api/v1/posts/{postID}:
    parameters: [{$ref: '#/components/parameters/PostID'}]
    get:
      tags: [Posts]
      summary: Moin 상세
      responses: {'200': {$ref: '#/components/responses/Post'}, '404': {$ref: '#/components/responses/Error'}}
    patch:
      tags: [Posts]
      summary: 내 Moin 수정
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      requestBody: {$ref: '#/components/requestBodies/UpdatePost'}
      responses: {'200': {$ref: '#/components/responses/Post'}, '403': {$ref: '#/components/responses/Error'}}
    delete:
      tags: [Posts]
      summary: 내 Moin 삭제
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      responses: {'204': {$ref: '#/components/responses/NoContent'}, '403': {$ref: '#/components/responses/Error'}}
  /api/v1/posts/{postID}/replies:
    get:
      tags: [Posts]
      summary: Echo 목록
      parameters: [{$ref: '#/components/parameters/PostID'}, {$ref: '#/components/parameters/Offset'}, {$ref: '#/components/parameters/Limit'}]
      responses: {'200': {$ref: '#/components/responses/PostPage'}}
  /api/v1/posts/{postID}/reactions:
    parameters: [{$ref: '#/components/parameters/PostID'}]
    post:
      tags: [Posts]
      summary: Signal 반응 추가
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, additionalProperties: false, required: [type], properties: {type: {type: string, enum: [like, useful, insight, question, verify]}}}}}
      responses: {'200': {$ref: '#/components/responses/Data'}}
    delete:
      tags: [Posts]
      summary: 내 반응 제거
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      responses: {'204': {$ref: '#/components/responses/NoContent'}}
  /api/v1/posts/{postID}/reactions/{reaction}:
    delete:
      tags: [Posts]
      summary: 지정 반응 제거
      parameters:
        - {$ref: '#/components/parameters/PostID'}
        - {name: reaction, in: path, required: true, schema: {type: string}}
        - {$ref: '#/components/parameters/CSRF'}
      responses: {'204': {$ref: '#/components/responses/NoContent'}}
  /api/v1/posts/{postID}/bookmark:
    parameters: [{$ref: '#/components/parameters/PostID'}]
    post:
      tags: [Posts]
      summary: Pocket 저장
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      responses: {'200': {$ref: '#/components/responses/Data'}}
    delete:
      tags: [Posts]
      summary: Pocket 제거
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      responses: {'204': {$ref: '#/components/responses/NoContent'}}
  /api/v1/posts/{postID}/remoin:
    post:
      tags: [Posts]
      summary: Remoin
      parameters: [{$ref: '#/components/parameters/PostID'}, {$ref: '#/components/parameters/CSRF'}]
      responses: {'201': {$ref: '#/components/responses/Post'}}
    delete:
      tags: [Posts]
      summary: Remoin 취소
      parameters: [{$ref: '#/components/parameters/PostID'}, {$ref: '#/components/parameters/CSRF'}]
      responses: {'204': {$ref: '#/components/responses/NoContent'}}
  /api/v1/moins:
    get:
      tags: [Posts]
      summary: Moin 목록 alias
      responses: {'200': {$ref: '#/components/responses/PostPage'}}
    post:
      tags: [Posts]
      summary: Moin 작성 alias
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      requestBody: {$ref: '#/components/requestBodies/CreatePost'}
      responses: {'201': {$ref: '#/components/responses/Post'}}
  /api/v1/moins/{postID}:
    get:
      tags: [Posts]
      summary: Moin 상세 alias
      parameters: [{$ref: '#/components/parameters/PostID'}]
      responses: {'200': {$ref: '#/components/responses/Post'}}
  /api/v1/users/{username}:
    get:
      tags: [Social]
      summary: 사용자 프로필
      parameters: [{$ref: '#/components/parameters/Username'}]
      responses: {'200': {$ref: '#/components/responses/User'}, '404': {$ref: '#/components/responses/Error'}}
  /api/v1/profiles/{username}:
    get:
      tags: [Social]
      summary: 사용자 프로필 alias
      parameters: [{$ref: '#/components/parameters/Username'}]
      responses: {'200': {$ref: '#/components/responses/User'}}
  /api/v1/links/{userID}:
    post:
      tags: [Social]
      summary: 사용자 Link
      parameters: [{$ref: '#/components/parameters/UserID'}, {$ref: '#/components/parameters/CSRF'}]
      responses: {'200': {$ref: '#/components/responses/Data'}}
    delete:
      tags: [Social]
      summary: Link 해제
      parameters: [{$ref: '#/components/parameters/UserID'}, {$ref: '#/components/parameters/CSRF'}]
      responses: {'204': {$ref: '#/components/responses/NoContent'}}
  /api/v1/users/{userID}/block:
    post:
      tags: [Social]
      summary: 사용자 차단
      parameters: [{$ref: '#/components/parameters/UserID'}, {$ref: '#/components/parameters/CSRF'}]
      responses: {'200': {$ref: '#/components/responses/Data'}}
    delete:
      tags: [Social]
      summary: 차단 해제
      parameters: [{$ref: '#/components/parameters/UserID'}, {$ref: '#/components/parameters/CSRF'}]
      responses: {'204': {$ref: '#/components/responses/NoContent'}}
  /api/v1/users/{userID}/mute:
    post:
      tags: [Social]
      summary: 사용자 음소거
      parameters: [{$ref: '#/components/parameters/UserID'}, {$ref: '#/components/parameters/CSRF'}]
      responses: {'200': {$ref: '#/components/responses/Data'}}
    delete:
      tags: [Social]
      summary: 음소거 해제
      parameters: [{$ref: '#/components/parameters/UserID'}, {$ref: '#/components/parameters/CSRF'}]
      responses: {'204': {$ref: '#/components/responses/NoContent'}}
  /api/v1/profile:
    get:
      tags: [Profile]
      summary: 내 프로필
      responses: {'200': {$ref: '#/components/responses/User'}}
    patch:
      tags: [Profile]
      summary: 내 프로필 수정
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      requestBody: {$ref: '#/components/requestBodies/Object'}
      responses: {'200': {$ref: '#/components/responses/User'}}
  /api/v1/profile/preferences:
    get:
      tags: [Profile]
      summary: 개인화·접근성 설정
      responses: {'200': {$ref: '#/components/responses/Data'}}
    put:
      tags: [Profile]
      summary: 개인화·접근성 설정 저장
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      requestBody: {$ref: '#/components/requestBodies/Object'}
      responses: {'200': {$ref: '#/components/responses/Data'}}
  /api/v1/profile/password:
    post:
      tags: [Profile]
      summary: 로컬 비밀번호 변경
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      requestBody: {$ref: '#/components/requestBodies/Object'}
      responses: {'204': {$ref: '#/components/responses/NoContent'}, '400': {$ref: '#/components/responses/Error'}}
  /api/v1/profile/keys:
    get:
      tags: [Profile]
      summary: 내 API·MCP 키 목록
      responses: {'200': {$ref: '#/components/responses/Data'}}
    post:
      tags: [Profile]
      summary: 키 생성(원문 1회 표시)
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      requestBody: {$ref: '#/components/requestBodies/APIKey'}
      responses: {'201': {$ref: '#/components/responses/Data'}}
  /api/v1/profile/keys/{keyID}:
    parameters: [{$ref: '#/components/parameters/KeyID'}]
    patch:
      tags: [Profile]
      summary: 키 권한·만료 변경
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      requestBody: {$ref: '#/components/requestBodies/APIKey'}
      responses: {'200': {$ref: '#/components/responses/Data'}}
    delete:
      tags: [Profile]
      summary: 키 폐기
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      responses: {'204': {$ref: '#/components/responses/NoContent'}}
  /api/v1/profile/keys/{keyID}/rotate:
    post:
      tags: [Profile]
      summary: 개인 키 원자적 회전
      parameters: [{$ref: '#/components/parameters/KeyID'}, {$ref: '#/components/parameters/CSRF'}]
      responses: {'200': {$ref: '#/components/responses/Data'}}
  /api/v1/topics:
    get:
      tags: [Discovery]
      summary: Topic·Pulse 목록
      parameters: [{$ref: '#/components/parameters/Offset'}, {$ref: '#/components/parameters/Limit'}]
      responses: {'200': {$ref: '#/components/responses/Data'}}
  /api/v1/topics/{slug}:
    get:
      tags: [Discovery]
      summary: Topic 상세
      parameters: [{$ref: '#/components/parameters/Slug'}]
      responses: {'200': {$ref: '#/components/responses/Data'}, '404': {$ref: '#/components/responses/Error'}}
  /api/v1/topics/{slug}/follow:
    post:
      tags: [Discovery]
      summary: Topic Link
      parameters: [{$ref: '#/components/parameters/Slug'}, {$ref: '#/components/parameters/CSRF'}]
      requestBody: {$ref: '#/components/requestBodies/OptionalObject'}
      responses: {'200': {$ref: '#/components/responses/Data'}}
    delete:
      tags: [Discovery]
      summary: Topic Link 해제
      parameters: [{$ref: '#/components/parameters/Slug'}, {$ref: '#/components/parameters/CSRF'}]
      responses: {'204': {$ref: '#/components/responses/NoContent'}}
  /api/v1/search:
    get:
      tags: [Discovery]
      summary: Moin·사용자·Topic·Moim 통합 검색
      parameters:
        - {name: q, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 100}}
        - {name: type, in: query, schema: {type: string, enum: [all, posts, users, topics, moims]}}
        - {$ref: '#/components/parameters/Offset'}
        - {$ref: '#/components/parameters/Limit'}
      responses: {'200': {$ref: '#/components/responses/Data'}}
  /api/v1/notifications:
    get:
      tags: [Notifications]
      summary: 내 알림
      parameters: [{$ref: '#/components/parameters/Offset'}, {$ref: '#/components/parameters/Limit'}]
      responses: {'200': {$ref: '#/components/responses/Data'}}
  /api/v1/notifications/read:
    post:
      tags: [Notifications]
      summary: 알림 읽음 처리
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      requestBody: {$ref: '#/components/requestBodies/Object'}
      responses: {'204': {$ref: '#/components/responses/NoContent'}}
  /api/v1/ws/notifications:
    get:
      tags: [Notifications]
      summary: WebSocket 실시간 알림
      responses: {'101': {description: Switching Protocols}, '401': {$ref: '#/components/responses/Error'}}
  /api/v1/ws:
    get:
      tags: [Notifications]
      summary: WebSocket 브랜드 alias
      responses: {'101': {description: Switching Protocols}}
  /api/v1/moims:
    get:
      tags: [Moims]
      summary: Moim 목록
      parameters: [{$ref: '#/components/parameters/Offset'}, {$ref: '#/components/parameters/Limit'}]
      responses: {'200': {$ref: '#/components/responses/Data'}}
    post:
      tags: [Moims]
      summary: Moim 생성
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      requestBody: {$ref: '#/components/requestBodies/CreateMoim'}
      responses: {'201': {$ref: '#/components/responses/Data'}, '409': {$ref: '#/components/responses/Error'}}
  /api/v1/moims/{slug}:
    get:
      tags: [Moims]
      summary: Moim 상세
      parameters: [{$ref: '#/components/parameters/Slug'}]
      responses: {'200': {$ref: '#/components/responses/Data'}, '404': {$ref: '#/components/responses/Error'}}
  /api/v1/moims/{slug}/join:
    post:
      tags: [Moims]
      summary: Moim 참여
      parameters: [{$ref: '#/components/parameters/Slug'}, {$ref: '#/components/parameters/CSRF'}]
      responses: {'200': {$ref: '#/components/responses/Data'}}
    delete:
      tags: [Moims]
      summary: Moim 나가기
      parameters: [{$ref: '#/components/parameters/Slug'}, {$ref: '#/components/parameters/CSRF'}]
      responses: {'204': {$ref: '#/components/responses/NoContent'}}
  /api/v1/moims/{slug}/members:
    post:
      tags: [Moims]
      summary: Moim 참여 alias
      parameters: [{$ref: '#/components/parameters/Slug'}, {$ref: '#/components/parameters/CSRF'}]
      responses: {'200': {$ref: '#/components/responses/Data'}}
    delete:
      tags: [Moims]
      summary: Moim 나가기 alias
      parameters: [{$ref: '#/components/parameters/Slug'}, {$ref: '#/components/parameters/CSRF'}]
      responses: {'204': {$ref: '#/components/responses/NoContent'}}
  /api/v1/media:
    post:
      tags: [Posts]
      summary: 이미지·동영상 media 업로드
      description: 사용자별 미첨부 media는 최대 100개·512 MiB입니다. 한도를 넘으면 `media_quota_exceeded`를 반환하며 기존 media를 Moin·프로필에 연결하거나 TTL 정리를 기다린 뒤 재시도합니다.
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [file]
              properties:
                file: {type: string, format: binary}
                altText: {type: string, maxLength: 500, description: 이미지·영상 대체 텍스트}
                alt: {type: string, maxLength: 500, deprecated: true, description: altText 호환 alias}
      responses: {'201': {$ref: '#/components/responses/Media'}, '413': {$ref: '#/components/responses/Error'}, '415': {$ref: '#/components/responses/Error'}, '429': {$ref: '#/components/responses/MediaQuotaExceeded'}}
  /api/v1/media/config:
    get:
      tags: [Posts]
      summary: 현재 사용자용 media 업로드 계약
      description: 관리자가 설정한 현재 파일 크기·Moin당 개수 제한과 서버가 허용하는 MIME type을 반환합니다. 미사용 업로드 TTL 같은 관리자 전용 값은 포함하지 않습니다.
      x-required-permissions: [posts:write]
      responses: {'200': {$ref: '#/components/responses/MediaClientConfig'}, '403': {$ref: '#/components/responses/Error'}, '503': {$ref: '#/components/responses/Error'}}
  /api/v1/media/{mediaID}:
    get:
      tags: [Posts]
      summary: media 조회
      parameters: [{$ref: '#/components/parameters/MediaID'}]
      responses: {'200': {description: 저장된 image/video bytes, content: {image/*: {schema: {type: string, format: binary}}, video/*: {schema: {type: string, format: binary}}}}, '206': {description: 동영상·미디어 byte range}, '404': {$ref: '#/components/responses/Error'}}
  /api/v1/reports:
    post:
      tags: [Governance]
      summary: 콘텐츠·사용자 신고
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      requestBody: {$ref: '#/components/requestBodies/Object'}
      responses: {'201': {$ref: '#/components/responses/Data'}}
  /api/v1/workflow/status:
    get:
      tags: [Governance]
      summary: 선택형 승인 정책 상태
      responses: {'200': {$ref: '#/components/responses/Data'}}
  /api/v1/approvals:
    get:
      tags: [Governance]
      summary: 검토 대기 목록
      parameters: [{$ref: '#/components/parameters/Offset'}, {$ref: '#/components/parameters/Limit'}]
      responses: {'200': {$ref: '#/components/responses/Data'}}
  /api/v1/approvals/{approvalID}/approve:
    post:
      tags: [Governance]
      summary: 승인
      parameters: [{$ref: '#/components/parameters/ApprovalID'}, {$ref: '#/components/parameters/CSRF'}]
      requestBody: {$ref: '#/components/requestBodies/OptionalObject'}
      responses: {'200': {$ref: '#/components/responses/Data'}, '409': {$ref: '#/components/responses/Error'}}
  /api/v1/approvals/{approvalID}/reject:
    post:
      tags: [Governance]
      summary: 반려
      parameters: [{$ref: '#/components/parameters/ApprovalID'}, {$ref: '#/components/parameters/CSRF'}]
      requestBody: {$ref: '#/components/requestBodies/Object'}
      responses: {'200': {$ref: '#/components/responses/Data'}}
  /api/v1/ai/status:
    get:
      tags: [AI]
      summary: AI 활성화와 모델 공개 정보
      responses: {'200': {$ref: '#/components/responses/Data'}}
  /api/v1/ai/chat:
    post:
      tags: [AI]
      summary: 기본 SSE streaming AI 요청
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      requestBody: {$ref: '#/components/requestBodies/AIChat'}
      responses:
        '200': {description: 공급자 형식의 upstream SSE byte stream, content: {text/event-stream: {schema: {type: string}}}}
        '400': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /api/v1/mcp:
    get:
      tags: [MCP]
      summary: MCP GET capability 확인(SSE channel 미제공)
      responses: {'405': {description: POST JSON-RPC 전송만 제공하며 Allow POST를 반환}}
    post:
      tags: [MCP]
      summary: MCP JSON-RPC
      requestBody: {$ref: '#/components/requestBodies/JSONRPC'}
      responses: {'200': {$ref: '#/components/responses/JSONRPC'}}
  /mcp:
    get:
      tags: [MCP]
      summary: Root MCP GET capability 확인(SSE channel 미제공)
      security: [{bearerAuth: []}]
      responses: {'405': {description: POST JSON-RPC 전송만 제공하며 Allow POST를 반환}, '401': {$ref: '#/components/responses/Error'}}
    post:
      tags: [MCP]
      summary: Root MCP JSON-RPC endpoint
      security: [{bearerAuth: []}]
      requestBody: {$ref: '#/components/requestBodies/JSONRPC'}
      responses: {'200': {$ref: '#/components/responses/JSONRPC'}, '401': {$ref: '#/components/responses/Error'}}
  /api/v1/admin/stats:
    get: {$ref: '#/components/pathItems/AdminRead'}
  /api/v1/admin/users:
    get: {$ref: '#/components/pathItems/AdminRead'}
    post: {$ref: '#/components/pathItems/AdminWrite'}
  /api/v1/admin/users/{userID}:
    patch:
      tags: [Admin]
      summary: 사용자 상태·역할 변경
      parameters: [{$ref: '#/components/parameters/UserID'}, {$ref: '#/components/parameters/CSRF'}]
      requestBody: {$ref: '#/components/requestBodies/Object'}
      responses: {'200': {$ref: '#/components/responses/Data'}}
  /api/v1/admin/users/{userID}/password:
    post:
      tags: [Admin]
      summary: 로컬 사용자 비밀번호 재설정
      parameters: [{$ref: '#/components/parameters/UserID'}, {$ref: '#/components/parameters/CSRF'}]
      requestBody: {$ref: '#/components/requestBodies/Object'}
      responses: {'204': {$ref: '#/components/responses/NoContent'}}
  /api/v1/admin/posts:
    get: {$ref: '#/components/pathItems/AdminRead'}
  /api/v1/admin/posts/{postID}:
    patch:
      tags: [Admin]
      summary: 콘텐츠 moderation 상태 변경
      parameters: [{$ref: '#/components/parameters/PostID'}, {$ref: '#/components/parameters/CSRF'}]
      requestBody: {$ref: '#/components/requestBodies/Object'}
      responses: {'200': {$ref: '#/components/responses/Data'}}
    delete:
      tags: [Admin]
      summary: 콘텐츠 관리자 삭제
      parameters: [{$ref: '#/components/parameters/PostID'}, {$ref: '#/components/parameters/CSRF'}]
      responses: {'204': {$ref: '#/components/responses/NoContent'}}
  /api/v1/admin/reports:
    get: {$ref: '#/components/pathItems/AdminRead'}
  /api/v1/admin/reports/{reportID}:
    patch:
      tags: [Admin]
      summary: 신고 처리·제재
      parameters: [{$ref: '#/components/parameters/ReportID'}, {$ref: '#/components/parameters/CSRF'}]
      requestBody: {$ref: '#/components/requestBodies/Object'}
      responses: {'200': {$ref: '#/components/responses/Data'}}
  /api/v1/admin/reports/{reportID}/resolve:
    post:
      tags: [Admin]
      summary: 신고 승인·처리 alias
      parameters: [{$ref: '#/components/parameters/ReportID'}, {$ref: '#/components/parameters/CSRF'}]
      requestBody: {$ref: '#/components/requestBodies/OptionalObject'}
      responses: {'200': {$ref: '#/components/responses/Data'}}
  /api/v1/admin/reports/{reportID}/reject:
    post:
      tags: [Admin]
      summary: 신고 반려 alias
      parameters: [{$ref: '#/components/parameters/ReportID'}, {$ref: '#/components/parameters/CSRF'}]
      requestBody: {$ref: '#/components/requestBodies/OptionalObject'}
      responses: {'200': {$ref: '#/components/responses/Data'}}
  /api/v1/admin/roles:
    get: {$ref: '#/components/pathItems/AdminRead'}
    put: {$ref: '#/components/pathItems/AdminWrite'}
  /api/v1/admin/settings:
    get: {$ref: '#/components/pathItems/AdminRead'}
  /api/v1/admin/settings/{settingKey}:
    put:
      tags: [Admin]
      summary: 일반 설정 저장
      parameters:
        - {name: settingKey, in: path, required: true, schema: {type: string}}
        - {$ref: '#/components/parameters/CSRF'}
      requestBody: {$ref: '#/components/requestBodies/AdminSetting'}
      responses: {'200': {$ref: '#/components/responses/Data'}}
  /api/v1/admin/oidc:
    get:
      tags: [Admin]
      summary: OIDC 설정 조회
      responses: {'200': {$ref: '#/components/responses/OIDCConfig'}, '403': {$ref: '#/components/responses/Error'}}
    put:
      tags: [Admin]
      summary: OIDC 설정과 exact-authority outbound 정책 저장
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      requestBody: {$ref: '#/components/requestBodies/OIDCConfig'}
      responses: {'200': {$ref: '#/components/responses/OIDCConfig'}, '400': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}}
  /api/v1/admin/oidc/test:
    post: {$ref: '#/components/pathItems/AdminAction'}
  /api/v1/admin/ai:
    get:
      tags: [Admin]
      summary: AI 설정 조회
      responses: {'200': {$ref: '#/components/responses/AIConfig'}, '403': {$ref: '#/components/responses/Error'}}
    put:
      tags: [Admin]
      summary: AI 설정과 exact-authority outbound 정책 저장
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      requestBody: {$ref: '#/components/requestBodies/AIConfig'}
      responses: {'200': {$ref: '#/components/responses/AIConfig'}, '400': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}}
  /api/v1/admin/ai/test:
    post: {$ref: '#/components/pathItems/AdminAction'}
  /api/v1/admin/workflow:
    get: {$ref: '#/components/pathItems/AdminRead'}
    put: {$ref: '#/components/pathItems/AdminWrite'}
  /api/v1/admin/audit:
    get: {$ref: '#/components/pathItems/AdminRead'}
  /api/v1/admin/outbox:
    get:
      tags: [Admin]
      summary: Dead Letter Outbox 이벤트 조회
      description: '`admin:access`와 `audit:read` 권한이 모두 필요합니다.'
      x-required-permissions: [admin:access, 'audit:read']
      parameters:
        - {name: status, in: query, schema: {type: string, const: dead_letter, default: dead_letter}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 30}}
      responses: {'200': {$ref: '#/components/responses/OutboxPage'}, '400': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}}
  /api/v1/admin/outbox/{eventID}/retry:
    post:
      tags: [Admin]
      summary: Dead Letter 이벤트 재처리
      description: '`admin:access`와 `outbox:manage` 권한이 필요합니다. 실패 원인을 해결한 뒤 lease·시도 수를 초기화하고 즉시 claim 가능한 상태로 되돌립니다.'
      x-required-permissions: [admin:access, 'outbox:manage']
      parameters: [{$ref: '#/components/parameters/EventID'}, {$ref: '#/components/parameters/CSRF'}]
      responses: {'202': {$ref: '#/components/responses/Data'}, '400': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}}
  /api/v1/admin/keys:
    get: {$ref: '#/components/pathItems/AdminRead'}
  /api/v1/admin/keys/{keyID}:
    patch:
      tags: [Admin]
      summary: 개인 키 permission·상태 변경
      parameters: [{$ref: '#/components/parameters/KeyID'}, {$ref: '#/components/parameters/CSRF'}]
      requestBody: {$ref: '#/components/requestBodies/APIKey'}
      responses: {'200': {$ref: '#/components/responses/Data'}}
    delete:
      tags: [Admin]
      summary: 개인 키 관리자 폐기
      parameters: [{$ref: '#/components/parameters/KeyID'}, {$ref: '#/components/parameters/CSRF'}]
      responses: {'204': {$ref: '#/components/responses/NoContent'}}
components:
  securitySchemes:
    cookieAuth: {type: apiKey, in: cookie, name: moina_session}
    bearerAuth: {type: http, scheme: bearer, bearerFormat: MOINA API/MCP key}
  parameters:
    CSRF:
      name: X-CSRF-Token
      in: header
      required: false
      description: Cookie 인증 unsafe 요청에서 필수. Bearer key에는 적용하지 않습니다.
      schema: {type: string}
    Offset: {name: offset, in: query, schema: {type: integer, minimum: 0, maximum: 1000000, default: 0}}
    Cursor:
      name: cursor
      in: query
      description: |
        서버가 직전 응답의 `nextCursor`로 발급한 versioned Base64 URL opaque keyset.
        Following은 publishedAt·ID를 보존합니다. For Me는 asOf·score·ID·rankingVersion과
        사용자별 서버 ranking snapshot ID를 보존합니다. Snapshot은 최근 후보 최대 200개의 개인화 설정과
        score component를 동결하며 같은 사용자·랭킹 버전·설정은 30초 bucket에서 재사용합니다. 최대 1시간
        유효하지만 사용자당 활성 3개 제한으로 반복 refresh 시 오래된 값이 조기 제거될 수 있습니다.
        snapshot이 만료되거나 랭킹 정책이 달라지면 client는 저장한 cursor를 버리고 첫 페이지부터 다시
        조회해야 합니다.
      schema: {type: string, minLength: 1, maxLength: 1024, examples: [eyJ2IjoxLCJtIjoiZm9sbG93aW5nIiwiLi4uIjoiLi4uIn0]}
    Limit: {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 30}}
    PostID: {name: postID, in: path, required: true, schema: {type: string}}
    UserID: {name: userID, in: path, required: true, schema: {type: string}}
    KeyID: {name: keyID, in: path, required: true, schema: {type: string}}
    MediaID: {name: mediaID, in: path, required: true, schema: {type: string}}
    ApprovalID: {name: approvalID, in: path, required: true, schema: {type: string}}
    ReportID: {name: reportID, in: path, required: true, schema: {type: string}}
    EventID: {name: eventID, in: path, required: true, schema: {type: string, minLength: 1, maxLength: 160}}
    Username: {name: username, in: path, required: true, schema: {type: string}}
    Slug: {name: slug, in: path, required: true, schema: {type: string, pattern: '^[a-z0-9-]+$'}}
  requestBodies:
    Login:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [username, password]
            properties:
              username: {type: string, minLength: 1, maxLength: 254}
              password: {type: string, minLength: 1, maxLength: 72, writeOnly: true}
    CreatePost:
      required: true
      content: {application/json: {schema: {$ref: '#/components/schemas/CreatePost'}}}
    UpdatePost:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [content]
            properties:
              content: {type: string, minLength: 1, maxLength: 5000}
    CreateMoim:
      required: true
      content: {application/json: {schema: {$ref: '#/components/schemas/CreateMoim'}}}
    Object:
      required: true
      content: {application/json: {schema: {type: object, additionalProperties: true}}}
    OptionalObject:
      required: false
      content: {application/json: {schema: {type: object, additionalProperties: true}}}
    APIKey:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              name: {type: string, minLength: 1, maxLength: 120}
              permissions: {type: array, uniqueItems: true, items: {type: string}}
              expiresAt: {type: [string, 'null'], format: date-time}
    AdminSetting:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [value]
            properties:
              value:
                anyOf:
                  - {$ref: '#/components/schemas/GeneralConfig'}
                  - {$ref: '#/components/schemas/APIAccessConfig'}
                  - {$ref: '#/components/schemas/MediaConfig'}
                  - {type: object, additionalProperties: true, description: 기관 사용자 정의 설정}
              sensitive: {type: boolean, default: false}
              revision: {type: [integer, 'null'], minimum: 1, description: 낙관적 동시성 제어용 현재 revision}
    OIDCConfig:
      required: true
      content: {application/json: {schema: {$ref: '#/components/schemas/OIDCConfigInput'}}}
    AIConfig:
      required: true
      content: {application/json: {schema: {$ref: '#/components/schemas/AIConfigInput'}}}
    AIChat:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [messages]
            properties:
              messages:
                type: array
                minItems: 1
                items:
                  type: object
                  required: [role, content]
                  properties:
                    role: {type: string, enum: [system, user, assistant]}
                    content: {type: string, minLength: 1}
              maxTokens: {type: integer, minimum: 1, maximum: 262144}
    JSONRPC:
      required: true
      content: {application/json: {schema: {$ref: '#/components/schemas/JSONRPCRequest'}}}
  responses:
    Health:
      description: healthy
      content: {application/json: {schema: {type: object, properties: {data: {type: object, properties: {status: {const: ok}}}}}}}
    Ready:
      description: ready
      content: {application/json: {schema: {type: object, properties: {data: {type: object, properties: {status: {const: ready}}}}}}}
    Metrics:
      description: Prometheus text exposition format
      content:
        text/plain:
          schema: {type: string}
          examples:
            metrics:
              value: |
                # TYPE moina_flow_latency_seconds histogram
                moina_flow_latency_seconds_count 42
                # TYPE moina_outbox_lag_seconds gauge
                moina_outbox_lag_seconds 0
    Version:
      description: version
      content: {application/json: {schema: {type: object, properties: {data: {$ref: '#/components/schemas/Version'}}}}}
    CurrentUser:
      description: current user
      content: {application/json: {schema: {type: object, properties: {data: {$ref: '#/components/schemas/AuthView'}}}}}
    User:
      description: user profile
      content: {application/json: {schema: {type: object, properties: {data: {$ref: '#/components/schemas/User'}}}}}
    Post:
      description: Moin
      content: {application/json: {schema: {type: object, properties: {data: {$ref: '#/components/schemas/Post'}}}}}
    Media:
      description: streaming 저장된 미디어 metadata
      content: {application/json: {schema: {type: object, properties: {data: {$ref: '#/components/schemas/Media'}}}}}
    MediaClientConfig:
      description: 인증된 작성 client가 적용할 현재 media 업로드 계약
      content: {application/json: {schema: {type: object, required: [data], properties: {data: {$ref: '#/components/schemas/MediaClientConfig'}}}}}
    MediaQuotaExceeded:
      description: 사용자별 미첨부 media 100개 또는 512 MiB quota 초과
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example:
            code: media_quota_exceeded
            message: 게시물에 연결하지 않은 미디어가 너무 많습니다. 기존 업로드를 게시물에 첨부하거나 정리 후 다시 시도해 주세요
    FeedSnapshotBusy:
      description: 같은 사용자의 다른 For Me 첫 페이지 snapshot 생성이 진행 중입니다. 1초 뒤 다시 시도합니다.
      headers:
        Retry-After:
          description: 재시도 전 대기할 초
          schema: {type: string, const: '1'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example:
            code: feed_snapshot_busy
            message: 다른 Flow 새로고침을 처리 중입니다. 잠시 후 다시 시도해 주세요
    PostPage:
      description: cursor page
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: object
                required: [items, nextCursor]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/Post'}}
                  nextCursor: {type: [string, 'null'], maxLength: 1024, description: 다음 페이지용 opaque versioned Base64 URL cursor. For Me 값에는 최대 1시간 유효한 ranking snapshot ID가 포함되며 활성 snapshot 제한으로 더 일찍 만료될 수 있습니다.}
    OIDCConfig:
      description: secret 원문을 제외한 OIDC 설정
      content: {application/json: {schema: {type: object, properties: {data: {$ref: '#/components/schemas/OIDCConfigView'}}}}}
    AIConfig:
      description: secret 원문을 제외한 AI 설정
      content: {application/json: {schema: {type: object, properties: {data: {$ref: '#/components/schemas/AIConfigView'}}}}}
    OutboxPage:
      description: Dead Letter 이벤트 목록
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: object
                required: [items, status, limit]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/DeadLetterEvent'}}
                  status: {const: dead_letter}
                  limit: {type: integer, minimum: 1, maximum: 100}
    Data:
      description: 응답 data
      content: {application/json: {schema: {type: object, properties: {data: {}}}}}
    JSONRPC:
      description: JSON-RPC response
      content: {application/json: {schema: {$ref: '#/components/schemas/JSONRPCResponse'}}, text/event-stream: {schema: {type: string}}}
    NoContent: {description: 성공, 응답 본문 없음}
    Error:
      description: 오류
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
  schemas:
    Version:
      type: object
      required: [name, version]
      properties:
        name: {const: moina}
        service: {const: moina}
        version: {type: string, pattern: '^v[0-9]+\.[0-9]+\.[0-9]+'}
        startedAt: {type: string, format: date-time}
    RegisterInput:
      type: object
      additionalProperties: false
      required: [username, displayName, email, password]
      properties:
        username: {type: string, minLength: 3, maxLength: 40}
        displayName: {type: string, minLength: 1, maxLength: 80}
        email: {type: string, format: email}
        password: {type: string, minLength: 12, maxLength: 72, writeOnly: true}
    AuthView:
      type: object
      required: [user, roles, permissions]
      properties:
        user: {$ref: '#/components/schemas/User'}
        roles: {type: array, items: {type: string}}
        permissions: {type: array, uniqueItems: true, items: {type: string}}
    User:
      type: object
      required: [id, username, displayName, roles, active]
      properties:
        id: {type: string}
        username: {type: string}
        displayName: {type: string}
        email: {type: string}
        bio: {type: string}
        avatarId: {type: string}
        avatarUrl: {type: string}
        accountType: {type: string, enum: [human, agent]}
        provider: {type: string}
        roles: {type: array, items: {type: string}}
        active: {type: boolean}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    Post:
      type: object
      required: [id, content, visibility, createdAt]
      properties:
        id: {type: string}
        author: {$ref: '#/components/schemas/User'}
        content: {type: string}
        visibility: {type: string, enum: [public, followers, moim]}
        replyToId: {type: string}
        quoteMoinId: {type: string}
        moimId: {type: string}
        media: {type: array, items: {$ref: '#/components/schemas/Media'}}
        topics: {type: array, items: {type: object, additionalProperties: true}}
        counts: {type: object, additionalProperties: {type: integer}}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    CreatePost:
      type: object
      additionalProperties: false
      required: [content]
      properties:
        content: {type: string, minLength: 1, maxLength: 5000}
        visibility: {type: string, enum: [public, followers, moim]}
        mediaIds: {type: array, maxItems: 12, uniqueItems: true, items: {type: string}}
        mediaAltTexts:
          type: object
          maxProperties: 12
          propertyNames: {type: string, minLength: 1}
          additionalProperties: {type: string, maxLength: 500}
          description: mediaIds에 포함된 ID별 최종 접근성 대체 텍스트
        replyToId: {type: string}
        quoteMoinId: {type: string}
        moimId: {type: string}
    CreateMoim:
      type: object
      additionalProperties: false
      required: [name, slug]
      properties:
        name: {type: string, minLength: 1, maxLength: 80}
        slug: {type: string, pattern: '^[a-z0-9][a-z0-9-]{2,49}$'}
        description: {type: string, maxLength: 1000}
        visibility: {type: string, enum: [public, private]}
    Media:
      type: object
      required: [id, filename, mimeType, size, createdAt]
      properties:
        id: {type: string}
        ownerId: {type: string}
        filename: {type: string}
        altText: {type: string, maxLength: 500}
        mimeType: {type: string, examples: [image/webp, video/mp4]}
        type: {type: string, enum: [image, video]}
        url: {type: string}
        size: {type: integer, format: int64, minimum: 1}
        width: {type: integer, minimum: 0}
        height: {type: integer, minimum: 0}
        createdAt: {type: string, format: date-time}
    GeneralConfig:
      type: object
      additionalProperties: false
      required: [serviceName, allowRegistration, sessionMinutes, defaultTimezone]
      properties:
        serviceName: {type: string, minLength: 1, maxLength: 80}
        allowRegistration: {type: boolean}
        sessionMinutes: {type: integer, minimum: 5, maximum: 1440}
        defaultTimezone: {type: string, examples: [Asia/Seoul]}
    APIAccessConfig:
      type: object
      additionalProperties: false
      required: [enabled, mcpEnabled, rateLimitPerMinute]
      properties:
        enabled: {type: boolean}
        mcpEnabled: {type: boolean}
        rateLimitPerMinute: {type: integer, minimum: 1, maximum: 10000}
    MediaConfig:
      type: object
      additionalProperties: false
      properties:
        maxUploadBytes: {type: integer, format: int64, minimum: 65536, maximum: 52428800, default: 10485760}
        maxPerPost: {type: integer, minimum: 1, maximum: 12, default: 4}
        orphanTtlHours: {type: integer, minimum: 1, maximum: 720, default: 24, description: Moin·프로필에 연결되지 않은 업로드 보존 시간}
    MediaClientConfig:
      type: object
      additionalProperties: false
      required: [maxUploadBytes, maxPerPost, acceptedTypes]
      properties:
        maxUploadBytes: {type: integer, format: int64, minimum: 65536, maximum: 52428800, description: 파일 한 개의 현재 최대 byte 수}
        maxPerPost: {type: integer, minimum: 1, maximum: 12, description: Moin 하나에 연결할 수 있는 현재 최대 media 수}
        acceptedTypes:
          type: array
          minItems: 6
          maxItems: 6
          uniqueItems: true
          description: 업로드 검사에서 허용하는 MIME type
          items: {type: string, enum: [image/jpeg, image/png, image/gif, image/webp, video/mp4, video/webm]}
    AllowedHosts:
      type: array
      maxItems: 64
      uniqueItems: true
      description: |
        exact DNS 이름/IP 또는 선택적 host:port. port 없는 항목은 URL scheme의 기본 port
        (HTTPS 443, HTTP 80)에만 일치하며 비기본 port는 host:port로 명시해야 합니다.
        scheme·경로·userinfo·wildcard는 허용하지 않습니다.
      items: {type: string, minLength: 1, maxLength: 255, examples: [keycloak.internal, 'ai.internal:8443']}
    PrivateAllowedHosts:
      type: array
      maxItems: 64
      uniqueItems: true
      description: |
        allowedHosts에도 같은 authority로 등록된 정확한 DNS hostname만 지정합니다. 이 목록의 hostname은
        DNS가 RFC1918 IPv4 또는 ULA IPv6를 반환해도 연결할 수 있습니다. port 없는 항목은 scheme 기본
        port에만 일치하고 비기본 port는 host:port로 명시합니다. IP literal, wildcard, scheme, 경로와
        userinfo는 허용하지 않습니다. loopback·link-local·cloud metadata·CGNAT·unspecified·multicast
        주소는 이 목록에 있어도 항상 차단됩니다. v0.1.0의 기존 사설 OIDC·AI host는 이 목록으로
        자동 이관되지 않으며 로컬 bootstrap 최고 관리자가 업그레이드 후 명시 저장해야 합니다.
      items: {type: string, minLength: 1, maxLength: 255, examples: [keycloak.internal, 'ai.internal:8443']}
    OIDCConfigBase:
      type: object
      properties:
        enabled: {type: boolean}
        issuerUrl: {type: string, format: uri}
        clientId: {type: string}
        redirectUrl: {type: string, format: uri}
        scopes: {type: array, maxItems: 20, items: {type: string}, default: [openid, profile, email]}
        autoProvision: {type: boolean, default: true}
        defaultRoles: {type: array, maxItems: 20, items: {type: string}, default: [member]}
        roleClaim: {type: string, default: realm_access.roles}
        roleMappings:
          type: object
          maxProperties: 100
          additionalProperties: {type: array, items: {type: string}}
        allowedHosts: {$ref: '#/components/schemas/AllowedHosts'}
        privateAllowedHosts: {$ref: '#/components/schemas/PrivateAllowedHosts'}
        allowInsecureHttp: {type: boolean, default: false, description: allowedHosts와 privateAllowedHosts에 명시된 폐쇄망 HTTP endpoint에만 사용}
    OIDCConfigInput:
      unevaluatedProperties: false
      allOf:
        - {$ref: '#/components/schemas/OIDCConfigBase'}
        - type: object
          properties:
            clientSecret: {type: string, writeOnly: true, description: 빈 값이면 기존 secret 유지}
            clearClientSecret: {type: boolean, default: false, writeOnly: true}
    OIDCConfigView:
      unevaluatedProperties: false
      allOf:
        - {$ref: '#/components/schemas/OIDCConfigBase'}
        - type: object
          properties:
            clientSecretConfigured: {type: boolean}
    AIConfigBase:
      type: object
      properties:
        enabled: {type: boolean}
        baseUrl: {type: string, format: uri}
        model: {type: string}
        apiStyle: {type: string, enum: [responses, chat_completions], default: responses}
        defaultMaxTokens: {type: integer, minimum: 1, maximum: 262144, default: 4096}
        maxTokens: {type: integer, minimum: 1, maximum: 262144, default: 262144}
        timeoutSeconds: {type: integer, minimum: 10, maximum: 3600, default: 300}
        allowedHosts: {$ref: '#/components/schemas/AllowedHosts'}
        privateAllowedHosts: {$ref: '#/components/schemas/PrivateAllowedHosts'}
        allowInsecureHttp: {type: boolean, default: false, description: allowedHosts와 privateAllowedHosts에 명시된 폐쇄망 HTTP endpoint에만 사용}
    AIConfigInput:
      unevaluatedProperties: false
      allOf:
        - {$ref: '#/components/schemas/AIConfigBase'}
        - type: object
          properties:
            apiKey: {type: string, writeOnly: true, description: 빈 값이면 기존 key 유지}
            clearApiKey: {type: boolean, default: false, writeOnly: true}
    AIConfigView:
      unevaluatedProperties: false
      allOf:
        - {$ref: '#/components/schemas/AIConfigBase'}
        - type: object
          properties:
            apiKeyConfigured: {type: boolean}
    DeadLetterEvent:
      type: object
      required: [id, type, aggregateId, attempts, maxAttempts, lastError, createdAt, deadLetteredAt]
      properties:
        id: {type: string}
        type: {type: string}
        aggregateId: {type: string}
        attempts: {type: integer, minimum: 1}
        maxAttempts: {type: integer, minimum: 1}
        payload: {description: 이벤트 처리용 JSON payload. audit 권한으로 보호하며 관리자 UI는 원문을 표시하지 않습니다.}
        lastError: {type: string, maxLength: 4000}
        lastAttemptAt: {type: [string, 'null'], format: date-time}
        createdAt: {type: string, format: date-time}
        deadLetteredAt: {type: string, format: date-time}
    Error:
      type: object
      required: [code, message]
      properties:
        code: {type: string}
        message: {type: string}
    JSONRPCRequest:
      type: object
      required: [jsonrpc, method]
      properties:
        jsonrpc: {const: '2.0'}
        id: {type: [string, integer, 'null']}
        method: {type: string}
        params: {type: object, additionalProperties: true}
    JSONRPCResponse:
      type: object
      required: [jsonrpc]
      properties:
        jsonrpc: {const: '2.0'}
        id: {type: [string, integer, 'null']}
        result: {}
        error: {type: object, additionalProperties: true}
  pathItems:
    AdminRead:
      tags: [Admin]
      summary: 관리자 조회
      responses: {'200': {$ref: '#/components/responses/Data'}, '403': {$ref: '#/components/responses/Error'}}
    AdminWrite:
      tags: [Admin]
      summary: 관리자 설정 변경
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      requestBody: {$ref: '#/components/requestBodies/Object'}
      responses: {'200': {$ref: '#/components/responses/Data'}, '403': {$ref: '#/components/responses/Error'}}
    AdminAction:
      tags: [Admin]
      summary: 관리자 연결 테스트
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      requestBody: {$ref: '#/components/requestBodies/OptionalObject'}
      responses: {'200': {$ref: '#/components/responses/Data'}, '400': {$ref: '#/components/responses/Error'}}
security:
  - cookieAuth: []
  - bearerAuth: []
