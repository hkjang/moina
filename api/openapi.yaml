openapi: 3.1.0
info:
  title: MOINA API
  version: 0.1.11
  summary: AI 소셜 지식 네트워크 REST·SSE·MCP API
  description: |
    서버에 실제 등록된 canonical route 계약입니다. 브라우저 session 또는 개인 API/MCP key로 인증합니다.
    Cookie 인증의 unsafe 요청은 `moina_csrf` cookie와 같은 `X-CSRF-Token` header가 필요합니다.
    Flow cursor는 versioned Base64 URL opaque keyset이므로 client가 해석하거나 조작하지 않습니다.
    For Me cursor는 사용자와 랭킹 버전에 결합된 서버 ranking snapshot ID를 포함합니다.
    Snapshot은 최대 1시간 유효하지만 사용자당 활성 3개 제한으로 더 일찍 만료될 수 있습니다.
  license: {name: MIT, identifier: MIT}
  contact: {name: MOINA, url: 'https://github.com/hkjang/moina'}
servers:
  - {url: '/', description: 같은 origin}
tags:
  - {name: System}
  - {name: Auth}
  - {name: Feed}
  - {name: Posts}
  - {name: Social}
  - {name: Profile}
  - {name: Discovery}
  - {name: Notifications}
  - {name: Moims}
  - {name: Governance}
  - {name: AI}
  - {name: Admin}
  - {name: MCP}
paths:
  /healthz:
    get:
      tags: [System]
      summary: 프로세스 상태
      security: []
      responses: {'200': {$ref: '#/components/responses/Health'}}
  /readyz:
    get:
      tags: [System]
      summary: PostgreSQL 준비 상태
      security: []
      responses: {'200': {$ref: '#/components/responses/Ready'}, '503': {$ref: '#/components/responses/Error'}}
  /metrics:
    get:
      tags: [System]
      summary: Prometheus 운영 지표
      description: 사용자·본문·SQL문을 label로 내보내지 않습니다. 공개 인터넷이 아닌 운영 수집망에서만 사용합니다.
      security: []
      responses: {'200': {$ref: '#/components/responses/Metrics'}}
  /api/v1/version:
    get:
      tags: [System]
      summary: 서비스 버전
      security: []
      responses: {'200': {$ref: '#/components/responses/Version'}}
  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: 로컬 로그인
      security: []
      requestBody: {$ref: '#/components/requestBodies/Login'}
      responses: {'200': {$ref: '#/components/responses/CurrentUser'}, '401': {$ref: '#/components/responses/Error'}, '429': {$ref: '#/components/responses/Error'}, '503': {$ref: '#/components/responses/Error'}}
  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: 관리자가 허용한 로컬 가입
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegisterInput'}
      responses: {'201': {$ref: '#/components/responses/CurrentUser'}, '403': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}, '429': {$ref: '#/components/responses/Error'}, '503': {$ref: '#/components/responses/Error'}}
  /api/v1/auth/oidc/status:
    get:
      tags: [Auth]
      summary: OIDC 활성화와 로그인 URL
      security: []
      responses: {'200': {$ref: '#/components/responses/Data'}}
  /api/v1/auth/oidc/login:
    get:
      tags: [Auth]
      summary: Authorization Code + PKCE 시작
      security: []
      parameters:
        - {name: returnTo, in: query, schema: {type: string, pattern: '^/'}}
      responses: {'302': {description: OIDC provider로 이동}, '404': {$ref: '#/components/responses/Error'}}
  /api/v1/auth/oidc/callback:
    get:
      tags: [Auth]
      summary: OIDC callback
      security: []
      parameters:
        - {name: code, in: query, required: true, schema: {type: string}}
        - {name: state, in: query, required: true, schema: {type: string}}
      responses: {'302': {description: 원래 앱 경로로 이동}, '400': {$ref: '#/components/responses/Error'}}
  /api/v1/auth/me:
    get:
      tags: [Auth]
      summary: 현재 사용자와 유효 권한
      responses: {'200': {$ref: '#/components/responses/CurrentUser'}, '401': {$ref: '#/components/responses/Error'}}
  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: session 종료
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      responses: {'204': {$ref: '#/components/responses/NoContent'}, '403': {$ref: '#/components/responses/Error'}}
  /api/v1/feed:
    get:
      tags: [Feed]
      summary: For Me 또는 Following feed
      description: |
        For Me 첫 페이지 snapshot 생성이 같은 사용자 요청과 겹치면
        `feed_snapshot_busy`, HTTP 429와 `Retry-After: 1`을 반환합니다.
      parameters:
        - {name: mode, in: query, schema: {type: string, enum: [for_me, following], default: for_me}}
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
      responses: {'200': {$ref: '#/components/responses/PostPage'}, '400': {$ref: '#/components/responses/Error'}, '429': {$ref: '#/components/responses/FeedSnapshotBusy'}}
  /api/v1/flows/{mode}:
    get:
      tags: [Feed]
      summary: 브랜드 언어 feed alias
      description: |
        For Me 첫 페이지 snapshot 생성이 같은 사용자 요청과 겹치면
        `feed_snapshot_busy`, HTTP 429와 `Retry-After: 1`을 반환합니다.
      parameters:
        - {name: mode, in: path, required: true, schema: {type: string, enum: [for_me, following]}}
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
      responses: {'200': {$ref: '#/components/responses/PostPage'}, '400': {$ref: '#/components/responses/Error'}, '429': {$ref: '#/components/responses/FeedSnapshotBusy'}}
  /api/v1/posts:
    get:
      tags: [Posts]
      summary: Moin 목록
      parameters:
        - {$ref: '#/components/parameters/Offset'}
        - {$ref: '#/components/parameters/Limit'}
        - {name: moim, in: query, description: Moim slug로 대화 목록을 제한합니다., schema: {type: string}}
        - {name: moimId, in: query, description: Moim ID로 대화 목록을 제한합니다., schema: {type: string}}
      responses: {'200': {$ref: '#/components/responses/PostPage'}}
    post:
      tags: [Posts]
      summary: Moin 또는 Echo 작성
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      requestBody: {$ref: '#/components/requestBodies/CreatePost'}
      description: 모임 Moin의 Echo·인용·Remoin은 부모의 moimId와 모임 공개 범위를 서버가 강제로 상속합니다.
      responses: {'201': {$ref: '#/components/responses/Post'}, '400': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}}
  /api/v1/posts/{postID}:
    parameters: [{$ref: '#/components/parameters/PostID'}]
    get:
      tags: [Posts]
      summary: Moin 상세
      responses: {'200': {$ref: '#/components/responses/Post'}, '404': {$ref: '#/components/responses/Error'}}
    patch:
      tags: [Posts]
      summary: 내 Moin 수정
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      requestBody: {$ref: '#/components/requestBodies/UpdatePost'}
      responses: {'200': {$ref: '#/components/responses/Post'}, '403': {$ref: '#/components/responses/Error'}}
    delete:
      tags: [Posts]
      summary: 내 Moin 삭제
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      responses: {'204': {$ref: '#/components/responses/NoContent'}, '403': {$ref: '#/components/responses/Error'}}
  /api/v1/posts/{postID}/replies:
    get:
      tags: [Posts]
      summary: Echo 목록
      parameters: [{$ref: '#/components/parameters/PostID'}, {$ref: '#/components/parameters/Offset'}, {$ref: '#/components/parameters/Limit'}]
      responses: {'200': {$ref: '#/components/responses/PostPage'}}
  /api/v1/posts/{postID}/reactions:
    parameters: [{$ref: '#/components/parameters/PostID'}]
    post:
      tags: [Posts]
      summary: Signal 반응 추가
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, additionalProperties: false, required: [type], properties: {type: {type: string, enum: [like, useful, insight, question, verify]}}}}}
      responses: {'200': {$ref: '#/components/responses/Data'}}
    delete:
      tags: [Posts]
      summary: 내 반응 제거
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      responses: {'204': {$ref: '#/components/responses/NoContent'}}
  /api/v1/posts/{postID}/reactions/{reaction}:
    delete:
      tags: [Posts]
      summary: 지정 반응 제거
      parameters:
        - {$ref: '#/components/parameters/PostID'}
        - {name: reaction, in: path, required: true, schema: {type: string}}
        - {$ref: '#/components/parameters/CSRF'}
      responses: {'204': {$ref: '#/components/responses/NoContent'}}
  /api/v1/posts/{postID}/bookmark:
    parameters: [{$ref: '#/components/parameters/PostID'}]
    post:
      tags: [Posts]
      summary: Pocket 저장
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      responses: {'200': {$ref: '#/components/responses/Data'}}
    delete:
      tags: [Posts]
      summary: Pocket 제거
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      responses: {'204': {$ref: '#/components/responses/NoContent'}}
  /api/v1/posts/{postID}/remoin:
    post:
      tags: [Posts]
      summary: Remoin
      parameters: [{$ref: '#/components/parameters/PostID'}, {$ref: '#/components/parameters/CSRF'}]
      responses: {'201': {$ref: '#/components/responses/Post'}}
    delete:
      tags: [Posts]
      summary: Remoin 취소
      parameters: [{$ref: '#/components/parameters/PostID'}, {$ref: '#/components/parameters/CSRF'}]
      responses: {'204': {$ref: '#/components/responses/NoContent'}}
  /api/v1/moins:
    get:
      tags: [Posts]
      summary: Moin 목록 alias
      responses: {'200': {$ref: '#/components/responses/PostPage'}}
    post:
      tags: [Posts]
      summary: Moin 작성 alias
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      requestBody: {$ref: '#/components/requestBodies/CreatePost'}
      responses: {'201': {$ref: '#/components/responses/Post'}}
  /api/v1/moins/{postID}:
    get:
      tags: [Posts]
      summary: Moin 상세 alias
      parameters: [{$ref: '#/components/parameters/PostID'}]
      responses: {'200': {$ref: '#/components/responses/Post'}}
  /api/v1/users/{username}:
    get:
      tags: [Social]
      summary: 사용자 프로필
      description: moinCount와 signal은 공개·게시 상태의 Moin 및 해당 Moin이 받은 Signal만 집계합니다.
      parameters: [{$ref: '#/components/parameters/Username'}]
      responses: {'200': {$ref: '#/components/responses/User'}, '404': {$ref: '#/components/responses/Error'}}
  /api/v1/profiles/{username}:
    get:
      tags: [Social]
      summary: 사용자 프로필 alias
      description: moinCount와 signal은 공개·게시 상태의 Moin 및 해당 Moin이 받은 Signal만 집계합니다.
      parameters: [{$ref: '#/components/parameters/Username'}]
      responses: {'200': {$ref: '#/components/responses/User'}}
  /api/v1/links/{userID}:
    post:
      tags: [Social]
      summary: 사용자 Link
      parameters: [{$ref: '#/components/parameters/UserID'}, {$ref: '#/components/parameters/CSRF'}]
      responses: {'200': {$ref: '#/components/responses/Data'}}
    delete:
      tags: [Social]
      summary: Link 해제
      parameters: [{$ref: '#/components/parameters/UserID'}, {$ref: '#/components/parameters/CSRF'}]
      responses: {'204': {$ref: '#/components/responses/NoContent'}}
  /api/v1/users/{userID}/block:
    post:
      tags: [Social]
      summary: 사용자 차단
      parameters: [{$ref: '#/components/parameters/UserID'}, {$ref: '#/components/parameters/CSRF'}]
      responses: {'200': {$ref: '#/components/responses/Data'}}
    delete:
      tags: [Social]
      summary: 차단 해제
      parameters: [{$ref: '#/components/parameters/UserID'}, {$ref: '#/components/parameters/CSRF'}]
      responses: {'204': {$ref: '#/components/responses/NoContent'}}
  /api/v1/users/{userID}/mute:
    post:
      tags: [Social]
      summary: 사용자 음소거
      parameters: [{$ref: '#/components/parameters/UserID'}, {$ref: '#/components/parameters/CSRF'}]
      responses: {'200': {$ref: '#/components/responses/Data'}}
    delete:
      tags: [Social]
      summary: 음소거 해제
      parameters: [{$ref: '#/components/parameters/UserID'}, {$ref: '#/components/parameters/CSRF'}]
      responses: {'204': {$ref: '#/components/responses/NoContent'}}
  /api/v1/profile:
    get:
      tags: [Profile]
      summary: 내 프로필
      responses: {'200': {$ref: '#/components/responses/User'}}
    patch:
      tags: [Profile]
      summary: 내 프로필 수정
      description: 본인이 업로드한 이미지 media ID를 avatarId로 지정하며 빈 문자열은 현재 프로필 이미지를 제거합니다.
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      requestBody: {$ref: '#/components/requestBodies/Profile'}
      responses: {'200': {$ref: '#/components/responses/User'}, '400': {$ref: '#/components/responses/Error'}}
  /api/v1/profile/preferences:
    get:
      tags: [Profile]
      summary: 개인화·접근성·알림 채널 설정
      description: 저장된 이전 버전 설정은 현재 중첩 알림 구조로 정규화해 완전한 문서로 반환합니다. 승인·보안 알림의 In App 노출은 운영 기록이므로 항상 활성화됩니다.
      responses: {'200': {$ref: '#/components/responses/Preferences'}}
    put:
      tags: [Profile]
      summary: 개인화·접근성·알림 채널 설정 부분 저장
      description: 전송한 section과 field만 변경하며 생략한 값은 보존합니다. JSON null과 알 수 없는 field는 허용하지 않습니다.
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      requestBody: {$ref: '#/components/requestBodies/PreferencesPatch'}
      responses: {'200': {$ref: '#/components/responses/Preferences'}, '400': {$ref: '#/components/responses/Error'}}
  /api/v1/profile/password:
    post:
      tags: [Profile]
      summary: 로컬 비밀번호 변경
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      requestBody: {$ref: '#/components/requestBodies/Object'}
      responses: {'204': {$ref: '#/components/responses/NoContent'}, '400': {$ref: '#/components/responses/Error'}}
  /api/v1/profile/keys:
    get:
      tags: [Profile]
      summary: 내 API·MCP 키 목록
      responses: {'200': {$ref: '#/components/responses/Data'}}
    post:
      tags: [Profile]
      summary: 키 생성(원문 1회 표시)
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      requestBody: {$ref: '#/components/requestBodies/APIKey'}
      responses: {'201': {$ref: '#/components/responses/Data'}}
  /api/v1/profile/keys/{keyID}:
    parameters: [{$ref: '#/components/parameters/KeyID'}]
    patch:
      tags: [Profile]
      summary: 키 권한·만료 변경
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      requestBody: {$ref: '#/components/requestBodies/APIKey'}
      responses: {'200': {$ref: '#/components/responses/Data'}}
    delete:
      tags: [Profile]
      summary: 키 폐기
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      responses: {'204': {$ref: '#/components/responses/NoContent'}}
  /api/v1/profile/keys/{keyID}/rotate:
    post:
      tags: [Profile]
      summary: 개인 키 원자적 회전
      parameters: [{$ref: '#/components/parameters/KeyID'}, {$ref: '#/components/parameters/CSRF'}]
      responses: {'200': {$ref: '#/components/responses/Data'}}
  /api/v1/topics:
    get:
      tags: [Discovery]
      summary: Topic·Pulse 목록
      description: trending은 최근 7일 공개 Moin과 Signal을 집계하고 최근 24시간 활동에 더 높은 가중치를 적용합니다.
      parameters:
        - {name: q, in: query, schema: {type: string}}
        - {name: sort, in: query, schema: {type: string, enum: [popular, trending, recent, name], default: popular}}
        - {$ref: '#/components/parameters/Offset'}
        - {$ref: '#/components/parameters/Limit'}
      responses: {'200': {$ref: '#/components/responses/Data'}, '400': {$ref: '#/components/responses/Error'}}
  /api/v1/topics/{slug}:
    get:
      tags: [Discovery]
      summary: Topic 상세
      parameters: [{$ref: '#/components/parameters/Slug'}]
      responses: {'200': {$ref: '#/components/responses/Data'}, '404': {$ref: '#/components/responses/Error'}}
  /api/v1/topics/{slug}/follow:
    post:
      tags: [Discovery]
      summary: Topic Link
      parameters: [{$ref: '#/components/parameters/Slug'}, {$ref: '#/components/parameters/CSRF'}]
      requestBody: {$ref: '#/components/requestBodies/OptionalObject'}
      responses: {'200': {$ref: '#/components/responses/Data'}}
    delete:
      tags: [Discovery]
      summary: Topic Link 해제
      parameters: [{$ref: '#/components/parameters/Slug'}, {$ref: '#/components/parameters/CSRF'}]
      responses: {'204': {$ref: '#/components/responses/NoContent'}}
  /api/v1/search:
    get:
      tags: [Discovery]
      summary: Moin·사용자·Topic·Moim 통합 검색
      parameters:
        - {name: q, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 100}}
        - {name: type, in: query, description: 지정한 검색 대상만 조회하며 생략하면 전체 대상을 조회합니다., schema: {type: string, enum: [all, posts, users, topics, moims], default: all}}
        - {$ref: '#/components/parameters/Offset'}
        - {$ref: '#/components/parameters/Limit'}
      responses: {'200': {$ref: '#/components/responses/Data'}, '400': {$ref: '#/components/responses/Error'}}
  /api/v1/notifications:
    get:
      tags: [Notifications]
      summary: 내 알림
      description: inApp=true인 알림 센터 항목만 반환하며 unreadCount도 같은 범위에서 계산합니다.
      parameters:
        - {name: filter, in: query, description: reaction은 signal의 저장 호환 alias입니다., schema: {type: string, enum: [all, signal, reaction, mention], default: all}}
        - {$ref: '#/components/parameters/Offset'}
        - {$ref: '#/components/parameters/Limit'}
      responses: {'200': {$ref: '#/components/responses/NotificationPage'}, '400': {$ref: '#/components/responses/Error'}}
  /api/v1/notifications/read:
    post:
      tags: [Notifications]
      summary: 알림 읽음 처리
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      requestBody: {$ref: '#/components/requestBodies/ReadNotifications'}
      responses: {'200': {$ref: '#/components/responses/Data'}, '400': {$ref: '#/components/responses/Error'}}
  /api/v1/notifications/email/status:
    get:
      tags: [Notifications]
      summary: 사용자 이메일 알림 사용 가능 여부
      description: 관리자 SMTP 설정의 세부 값은 노출하지 않고 SMTP와 현재 사용자 프로필 이메일의 준비 여부만 반환합니다. Browser session 전용입니다.
      responses: {'200': {$ref: '#/components/responses/NotificationEmailStatus'}, '401': {$ref: '#/components/responses/Error'}}
  /api/v1/ws/notifications:
    get:
      tags: [Notifications]
      summary: WebSocket 실시간 알림
      description: 연결 확인 event 이후 Notification JSON을 전달합니다. `inApp`, `toast`, `desktop`은 현재 사용자 설정·조용한 시간·Digest 정책을 반영한 독립 채널 flag입니다. In App을 끈 유형도 cross-instance 실시간 전달을 위해 숨김·읽음 상태의 durable row로 보관합니다.
      responses: {'101': {description: Switching Protocols. 이후 Notification JSON frame 전달}, '401': {$ref: '#/components/responses/Error'}}
  /api/v1/ws:
    get:
      tags: [Notifications]
      summary: WebSocket 브랜드 alias
      description: '/api/v1/ws/notifications와 동일한 Notification JSON frame을 전달합니다.'
      responses: {'101': {description: Switching Protocols. 이후 Notification JSON frame 전달}}
  /api/v1/moims:
    get:
      tags: [Moims]
      summary: Moim 목록
      parameters: [{$ref: '#/components/parameters/Offset'}, {$ref: '#/components/parameters/Limit'}]
      responses: {'200': {$ref: '#/components/responses/Data'}}
    post:
      tags: [Moims]
      summary: Moim 생성
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      requestBody: {$ref: '#/components/requestBodies/CreateMoim'}
      responses: {'201': {$ref: '#/components/responses/Data'}, '409': {$ref: '#/components/responses/Error'}}
  /api/v1/moims/{slug}:
    get:
      tags: [Moims]
      summary: Moim 상세
      parameters: [{$ref: '#/components/parameters/Slug'}]
      responses: {'200': {$ref: '#/components/responses/Data'}, '404': {$ref: '#/components/responses/Error'}}
  /api/v1/moims/{slug}/join:
    post:
      tags: [Moims]
      summary: Moim 참여
      parameters: [{$ref: '#/components/parameters/Slug'}, {$ref: '#/components/parameters/CSRF'}]
      responses: {'200': {$ref: '#/components/responses/Data'}}
    delete:
      tags: [Moims]
      summary: Moim 나가기
      parameters: [{$ref: '#/components/parameters/Slug'}, {$ref: '#/components/parameters/CSRF'}]
      responses: {'204': {$ref: '#/components/responses/NoContent'}}
  /api/v1/moims/{slug}/members:
    post:
      tags: [Moims]
      summary: Moim 참여 alias
      parameters: [{$ref: '#/components/parameters/Slug'}, {$ref: '#/components/parameters/CSRF'}]
      responses: {'200': {$ref: '#/components/responses/Data'}}
    delete:
      tags: [Moims]
      summary: Moim 나가기 alias
      parameters: [{$ref: '#/components/parameters/Slug'}, {$ref: '#/components/parameters/CSRF'}]
      responses: {'204': {$ref: '#/components/responses/NoContent'}}
  /api/v1/media:
    post:
      tags: [Posts]
      summary: 이미지·동영상 media 업로드
      description: 브라우저 세션은 개인 프로필 이미지에도 사용할 수 있으며 API key는 `posts:write`가 필요합니다. 사용자별 미첨부 media는 최대 100개·512 MiB입니다. 한도를 넘으면 `media_quota_exceeded`를 반환하며 기존 media를 Moin·프로필에 연결하거나 TTL 정리를 기다린 뒤 재시도합니다. 업로드의 `altText`는 재사용 시 기본값이며 Moin 문맥의 최종 대체 텍스트는 게시물 작성·수정 요청의 `mediaAltTexts`로 각 `post_media` 관계에 저장합니다.
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [file]
              properties:
                file: {type: string, format: binary}
                altText: {type: string, maxLength: 500, description: 새 Moin 연결 시 사용할 이미지·영상 기본 대체 텍스트}
                alt: {type: string, maxLength: 500, deprecated: true, description: altText 호환 alias}
      responses: {'201': {$ref: '#/components/responses/Media'}, '413': {$ref: '#/components/responses/Error'}, '415': {$ref: '#/components/responses/Error'}, '429': {$ref: '#/components/responses/MediaQuotaExceeded'}}
  /api/v1/media/config:
    get:
      tags: [Posts]
      summary: 현재 사용자용 media 업로드 계약
      description: 브라우저 세션 또는 `posts:write` API key에 관리자가 설정한 현재 파일 크기·Moin당 개수 제한과 서버가 허용하는 MIME type을 반환합니다. 미사용 업로드 TTL 같은 관리자 전용 값은 포함하지 않습니다.
      x-required-permissions: [posts:write]
      responses: {'200': {$ref: '#/components/responses/MediaClientConfig'}, '403': {$ref: '#/components/responses/Error'}, '503': {$ref: '#/components/responses/Error'}}
  /api/v1/media/{mediaID}:
    get:
      tags: [Posts]
      summary: media 조회
      description: 브라우저 세션은 본인 소유 media를 항상 조회할 수 있고 다른 사용자의 게시물·프로필 media에는 `posts:read` 최종 권한이 필요합니다. API key도 `posts:read`가 필요하며 서버는 차단 관계와 공개 범위를 별도로 검사합니다.
      parameters: [{$ref: '#/components/parameters/MediaID'}]
      responses: {'200': {description: 저장된 image/video bytes, content: {image/*: {schema: {type: string, format: binary}}, video/*: {schema: {type: string, format: binary}}}}, '206': {description: 동영상·미디어 byte range}, '404': {$ref: '#/components/responses/Error'}}
    delete:
      tags: [Posts]
      summary: 연결되지 않은 내 media 즉시 삭제
      description: 브라우저 세션 또는 `posts:write` API key로 본인이 소유하고 Moin 첨부 또는 프로필 avatar로 사용되지 않는 media만 삭제합니다. 존재 여부와 사용 상태는 구분해 노출하지 않습니다.
      parameters: [{$ref: '#/components/parameters/MediaID'}, {$ref: '#/components/parameters/CSRF'}]
      x-required-permissions: [posts:write]
      responses: {'204': {$ref: '#/components/responses/NoContent'}, '409': {$ref: '#/components/responses/Error'}}
  /api/v1/reports:
    post:
      tags: [Governance]
      summary: 콘텐츠·사용자 신고
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      requestBody: {$ref: '#/components/requestBodies/Object'}
      responses: {'201': {$ref: '#/components/responses/Data'}}
  /api/v1/workflow/status:
