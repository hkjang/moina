          schema: {type: string, pattern: '^[a-z][a-z0-9_.-]{1,127}$', examples: [network.proxy]}
        - {$ref: '#/components/parameters/CSRF'}
      requestBody: {$ref: '#/components/requestBodies/AdminSetting'}
      responses: {'200': {$ref: '#/components/responses/Data'}, '400': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}}
  /api/v1/admin/oidc:
