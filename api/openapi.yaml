  /api/v1/admin/ai:
    get:
      tags: [Admin]
      summary: AI 설정 조회
      responses: {'200': {$ref: '#/components/responses/AIConfig'}, '403': {$ref: '#/components/responses/Error'}}
    put:
      tags: [Admin]
      summary: AI 설정과 exact-authority outbound 정책 저장
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      requestBody: {$ref: '#/components/requestBodies/AIConfig'}
      responses: {'200': {$ref: '#/components/responses/AIConfig'}, '400': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}}
  /api/v1/admin/ai/test:
    post: {$ref: '#/components/pathItems/AdminAction'}
  /api/v1/admin/smtp:
    get:
      tags: [Admin]
      summary: SMTP 메일 설정 조회
      description: 저장된 password 원문은 반환하지 않고 passwordConfigured만 반환합니다.
      responses: {'200': {$ref: '#/components/responses/SMTPConfig'}, '403': {$ref: '#/components/responses/Error'}}
    put:
      tags: [Admin]
      summary: 암호화된 SMTP 메일 설정 저장
      description: 정확한 SMTP host:port만 연결하며, 사설망 허용 시에도 설정한 DNS 이름만 RFC1918·ULA로 해석할 수 있습니다. loopback·link-local·metadata·CGNAT은 항상 차단합니다.
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      requestBody: {$ref: '#/components/requestBodies/SMTPConfig'}
      responses: {'200': {$ref: '#/components/responses/SMTPConfig'}, '400': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}}
  /api/v1/admin/smtp/test:
