      parameters: [{$ref: '#/components/parameters/ApprovalID'}, {$ref: '#/components/parameters/CSRF'}]
      requestBody: {$ref: '#/components/requestBodies/OptionalObject'}
      responses: {'200': {$ref: '#/components/responses/Data'}, '409': {$ref: '#/components/responses/Error'}}
  /api/v1/approvals/{approvalID}/reject:
    post:
