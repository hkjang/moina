  /api/v1/admin/workflow:
    get:
      tags: [Admin]
      summary: 검토·승인 정책 조회
      responses: {'200': {$ref: '#/components/responses/WorkflowConfig'}, '403': {$ref: '#/components/responses/Error'}}
    put:
      tags: [Admin]
      summary: 검토·승인 정책 저장
      description: 모든 approver 역할은 저장 시점의 최종 유효 권한으로 `approvals:review`를 가져야 합니다. `*`와 `approvals:*` 권한도 유효합니다.
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      requestBody: {$ref: '#/components/requestBodies/WorkflowConfig'}
      responses: {'200': {$ref: '#/components/responses/WorkflowConfig'}, '400': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}}
  /api/v1/admin/audit:
    get: {$ref: '#/components/pathItems/AdminRead'}
  /api/v1/admin/outbox:
    get:
      tags: [Admin]
      summary: Dead Letter Outbox 이벤트 조회
      description: '`admin:access`와 `audit:read` 권한이 모두 필요합니다.'
      x-required-permissions: [admin:access, 'audit:read']
      parameters:
        - {name: status, in: query, schema: {type: string, const: dead_letter, default: dead_letter}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 30}}
      responses: {'200': {$ref: '#/components/responses/OutboxPage'}, '400': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}}
  /api/v1/admin/outbox/{eventID}/retry:
    post:
      tags: [Admin]
      summary: Dead Letter 이벤트 재처리
      description: '`admin:access`와 `outbox:manage` 권한이 필요합니다. 실패 원인을 해결한 뒤 lease·시도 수를 초기화하고 즉시 claim 가능한 상태로 되돌립니다.'
      x-required-permissions: [admin:access, 'outbox:manage']
      parameters: [{$ref: '#/components/parameters/EventID'}, {$ref: '#/components/parameters/CSRF'}]
      responses: {'202': {$ref: '#/components/responses/Data'}, '400': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}}
  /api/v1/admin/keys:
    get: {$ref: '#/components/pathItems/AdminRead'}
  /api/v1/admin/keys/{keyID}:
    patch:
      tags: [Admin]
      summary: 개인 키 permission·상태 변경
      parameters: [{$ref: '#/components/parameters/KeyID'}, {$ref: '#/components/parameters/CSRF'}]
      requestBody: {$ref: '#/components/requestBodies/APIKey'}
      responses: {'200': {$ref: '#/components/responses/Data'}}
    delete:
      tags: [Admin]
      summary: 개인 키 관리자 폐기
      parameters: [{$ref: '#/components/parameters/KeyID'}, {$ref: '#/components/parameters/CSRF'}]
      responses: {'204': {$ref: '#/components/responses/NoContent'}}
components:
  securitySchemes:
    cookieAuth: {type: apiKey, in: cookie, name: moina_session}
    bearerAuth: {type: http, scheme: bearer, bearerFormat: MOINA API/MCP key, description: 키별 분당 한도는 PostgreSQL 전역 bucket으로 모든 인스턴스가 공유합니다. 저장소 오류는 503 rate_limit_unavailable입니다.}
  parameters:
    CSRF:
      name: X-CSRF-Token
      in: header
      required: false
      description: Cookie 인증 unsafe 요청에서 필수. Bearer key에는 적용하지 않습니다.
      schema: {type: string}
    Offset: {name: offset, in: query, schema: {type: integer, minimum: 0, maximum: 1000000, default: 0}}
    Cursor:
      name: cursor
      in: query
      description: |
        서버가 직전 응답의 `nextCursor`로 발급한 versioned Base64 URL opaque keyset.
        Following은 publishedAt·ID를 보존합니다. For Me는 asOf·score·ID·rankingVersion과
        사용자별 서버 ranking snapshot ID를 보존합니다. Snapshot은 최근 후보 최대 200개의 개인화 설정과
        score component를 동결하며 같은 사용자·랭킹 버전·설정은 30초 bucket에서 재사용합니다. 최대 1시간
        유효하지만 사용자당 활성 3개 제한으로 반복 refresh 시 오래된 값이 조기 제거될 수 있습니다.
        snapshot이 만료되거나 랭킹 정책이 달라지면 client는 저장한 cursor를 버리고 첫 페이지부터 다시
        조회해야 합니다.
      schema: {type: string, minLength: 1, maxLength: 1024, examples: [eyJ2IjoxLCJtIjoiZm9sbG93aW5nIiwiLi4uIjoiLi4uIn0]}
    Limit: {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 30}}
    PostID: {name: postID, in: path, required: true, schema: {type: string}}
    UserID: {name: userID, in: path, required: true, schema: {type: string}}
    KeyID: {name: keyID, in: path, required: true, schema: {type: string}}
    MediaID: {name: mediaID, in: path, required: true, schema: {type: string}}
    ApprovalID: {name: approvalID, in: path, required: true, schema: {type: string}}
    ReportID: {name: reportID, in: path, required: true, schema: {type: string}}
    EventID: {name: eventID, in: path, required: true, schema: {type: string, minLength: 1, maxLength: 160}}
    Username: {name: username, in: path, required: true, schema: {type: string}}
    Slug: {name: slug, in: path, required: true, schema: {type: string, pattern: '^[a-z0-9-]+$'}}
  requestBodies:
    Login:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [username, password]
            properties:
              username: {type: string, minLength: 1, maxLength: 254}
              password: {type: string, minLength: 1, maxLength: 72, writeOnly: true}
    CreatePost:
      required: true
      content: {application/json: {schema: {$ref: '#/components/schemas/CreatePost'}}}
    UpdatePost:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [content]
            properties:
              content: {type: string, minLength: 1, maxLength: 5000}
              mediaIds:
                type: array
                maxItems: 12
                uniqueItems: true
                items: {type: string}
                description: |
                  생략하면 기존 첨부를 유지합니다. 빈 배열은 모두 제거하고, 제공한 배열은 순서까지 포함해
                  전체 첨부 목록을 교체합니다. 본인이 업로드한 media만 사용할 수 있습니다. 관리자가
                  maxPerPost를 낮춰 기존 첨부 수가 현재 한도를 넘는 경우에는 신규 media를 추가하지 않는
                  기존 집합의 부분집합·재정렬만 허용합니다.
              mediaAltTexts:
                type: object
                maxProperties: 12
                propertyNames: {type: string, minLength: 1}
                additionalProperties: {type: string, maxLength: 500}
                description: 변경 후 이 Moin에 연결된 media ID별 문맥 대체 텍스트. 생략한 기존 media 설명은 유지되고 신규 media는 upload 기본 설명을 사용합니다. 다른 Moin에서 같은 media를 재사용해도 값이 공유되지 않습니다.
    CreateMoim:
      required: true
      content: {application/json: {schema: {$ref: '#/components/schemas/CreateMoim'}}}
    Profile:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            minProperties: 1
            properties:
              displayName: {type: string, minLength: 1, maxLength: 80}
              email: {type: string, maxLength: 254}
              bio: {type: string, maxLength: 500}
              avatarId: {type: string, description: 본인 소유 이미지 media ID. 빈 문자열은 현재 프로필 이미지 제거}
    Object:
      required: true
      content: {application/json: {schema: {type: object, additionalProperties: true}}}
    OptionalObject:
      required: false
      content: {application/json: {schema: {type: object, additionalProperties: true}}}
    APIKey:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              name: {type: string, minLength: 1, maxLength: 120}
              permissions: {type: array, uniqueItems: true, items: {type: string}}
              expiresAt: {type: [string, 'null'], format: date-time}
    ReadNotifications:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              ids: {type: array, minItems: 1, items: {type: string}}
              all: {type: boolean, default: false}
            anyOf:
              - required: [ids]
              - properties: {all: {const: true}}
                required: [all]
    AdminSetting:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [value]
            properties:
              value:
                anyOf:
                  - {$ref: '#/components/schemas/GeneralConfig'}
                  - {$ref: '#/components/schemas/APIAccessConfig'}
                  - {$ref: '#/components/schemas/MediaConfig'}
                  - {$ref: '#/components/schemas/NetworkProxyConfig'}
                  - {type: object, additionalProperties: true, description: 기관 사용자 정의 설정}
              sensitive: {type: boolean, default: false}
              revision: {type: [integer, 'null'], minimum: 1, description: 낙관적 동시성 제어용 현재 revision}
    PreferencesPatch:
      required: true
      content: {application/json: {schema: {$ref: '#/components/schemas/PreferencesPatch'}}}
    WorkflowConfig:
      required: true
      content: {application/json: {schema: {$ref: '#/components/schemas/WorkflowConfig'}}}
    OIDCConfig:
      required: true
      content: {application/json: {schema: {$ref: '#/components/schemas/OIDCConfigInput'}}}
    AIConfig:
      required: true
      content: {application/json: {schema: {$ref: '#/components/schemas/AIConfigInput'}}}
    SMTPConfig:
      required: true
      content: {application/json: {schema: {$ref: '#/components/schemas/SMTPConfigInput'}}}
    AIChat:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [messages]
            properties:
              messages:
                type: array
                minItems: 1
                items:
                  type: object
                  required: [role, content]
                  properties:
                    role: {type: string, enum: [system, user, assistant]}
                    content: {type: string, minLength: 1}
              maxTokens: {type: integer, minimum: 1, maximum: 262144}
    JSONRPC:
      required: true
      content: {application/json: {schema: {$ref: '#/components/schemas/JSONRPCRequest'}}}
  responses:
    Health:
      description: healthy
      content: {application/json: {schema: {type: object, properties: {data: {type: object, properties: {status: {const: ok}}}}}}}
    Ready:
      description: ready
      content: {application/json: {schema: {type: object, properties: {data: {type: object, properties: {status: {const: ready}}}}}}}
    Metrics:
      description: Prometheus text exposition format
      content:
        text/plain:
          schema: {type: string}
          examples:
            metrics:
              value: |
                # TYPE moina_flow_latency_seconds histogram
                moina_flow_latency_seconds_count 42
                # TYPE moina_outbox_lag_seconds gauge
                moina_outbox_lag_seconds 0
    Version:
      description: version
      content: {application/json: {schema: {type: object, properties: {data: {$ref: '#/components/schemas/Version'}}}}}
    CurrentUser:
      description: current user
      content: {application/json: {schema: {type: object, properties: {data: {$ref: '#/components/schemas/AuthView'}}}}}
    User:
      description: user profile
      content: {application/json: {schema: {type: object, properties: {data: {$ref: '#/components/schemas/User'}}}}}
    Post:
      description: Moin
      content: {application/json: {schema: {type: object, properties: {data: {$ref: '#/components/schemas/Post'}}}}}
    Media:
      description: streaming 저장된 미디어 metadata
      content: {application/json: {schema: {type: object, properties: {data: {$ref: '#/components/schemas/Media'}}}}}
    MediaClientConfig:
      description: 인증된 작성 client가 적용할 현재 media 업로드 계약
      content: {application/json: {schema: {type: object, required: [data], properties: {data: {$ref: '#/components/schemas/MediaClientConfig'}}}}}
    MediaQuotaExceeded:
      description: 사용자별 미첨부 media 100개 또는 512 MiB quota 초과
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example:
            code: media_quota_exceeded
            message: 게시물에 연결하지 않은 미디어가 너무 많습니다. 기존 업로드를 게시물에 첨부하거나 정리 후 다시 시도해 주세요
    FeedSnapshotBusy:
      description: 같은 사용자의 다른 For Me 첫 페이지 snapshot 생성이 진행 중입니다. 1초 뒤 다시 시도합니다.
      headers:
        Retry-After:
          description: 재시도 전 대기할 초
          schema: {type: string, const: '1'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example:
            code: feed_snapshot_busy
            message: 다른 Flow 새로고침을 처리 중입니다. 잠시 후 다시 시도해 주세요
    PostPage:
      description: cursor page
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: object
                required: [items, nextCursor]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/Post'}}
                  nextCursor: {type: [string, 'null'], maxLength: 1024, description: 다음 페이지용 opaque versioned Base64 URL cursor. For Me 값에는 최대 1시간 유효한 ranking snapshot ID가 포함되며 활성 snapshot 제한으로 더 일찍 만료될 수 있습니다.}
    Preferences:
      description: 기본값과 저장된 부분 설정을 합친 완전한 개인 설정 문서
      content: {application/json: {schema: {type: object, required: [data], properties: {data: {$ref: '#/components/schemas/Preferences'}}}}}
    NotificationPage:
      description: "inApp=true인 durable 알림 목록과 해당 알림의 전체 미확인 수. 숨김 전달 row는 포함하지 않습니다."
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                type: object
                additionalProperties: false
                required: [items, unreadCount, limit, offset]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/Notification'}}
                  unreadCount: {type: integer, format: int64, minimum: 0}
                  limit: {type: integer, minimum: 1, maximum: 100}
                  offset: {type: integer, minimum: 0}
    NotificationEmailStatus:
      description: 이메일 알림 준비 상태. SMTP 세부 설정과 수신 주소는 노출하지 않습니다.
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: {$ref: '#/components/schemas/NotificationEmailStatus'}
    WorkflowConfig:
      description: 현재 검토·승인 정책
      content: {application/json: {schema: {type: object, required: [data], properties: {data: {$ref: '#/components/schemas/WorkflowConfig'}}}}}
    OIDCConfig:
      description: secret 원문을 제외한 OIDC 설정
      content: {application/json: {schema: {type: object, properties: {data: {$ref: '#/components/schemas/OIDCConfigView'}}}}}
    AIConfig:
      description: secret 원문을 제외한 AI 설정
      content: {application/json: {schema: {type: object, properties: {data: {$ref: '#/components/schemas/AIConfigView'}}}}}
    SMTPConfig:
      description: password 원문을 제외한 SMTP 설정
      content: {application/json: {schema: {type: object, properties: {data: {$ref: '#/components/schemas/SMTPConfigView'}}}}}
    OutboxPage:
      description: Dead Letter 이벤트 목록
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: object
                required: [items, status, limit]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/DeadLetterEvent'}}
                  status: {const: dead_letter}
                  limit: {type: integer, minimum: 1, maximum: 100}
    Data:
      description: 응답 data
      content: {application/json: {schema: {type: object, properties: {data: {}}}}}
    JSONRPC:
      description: JSON-RPC response
      content: {application/json: {schema: {$ref: '#/components/schemas/JSONRPCResponse'}}, text/event-stream: {schema: {type: string}}}
    NoContent: {description: 성공, 응답 본문 없음}
    Error:
      description: 오류
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
  schemas:
    Version:
      type: object
      required: [name, version]
      properties:
        name: {const: moina}
        service: {const: moina}
        version: {type: string, pattern: '^v[0-9]+\.[0-9]+\.[0-9]+'}
        startedAt: {type: string, format: date-time}
    RegisterInput:
      type: object
      additionalProperties: false
      required: [username, displayName, email, password]
      properties:
        username: {type: string, minLength: 3, maxLength: 40}
        displayName: {type: string, minLength: 1, maxLength: 80}
        email: {type: string, format: email}
        password: {type: string, minLength: 12, maxLength: 72, writeOnly: true}
    AuthView:
      type: object
      required: [user, roles, permissions]
      properties:
        user: {$ref: '#/components/schemas/User'}
        roles: {type: array, items: {type: string}}
        permissions: {type: array, uniqueItems: true, items: {type: string}}
    Preferences:
      type: object
      additionalProperties: false
      required: [appearance, feed, notifications]
      properties:
        appearance: {$ref: '#/components/schemas/AppearancePreferences'}
        feed: {$ref: '#/components/schemas/FeedPreferences'}
        notifications: {$ref: '#/components/schemas/NotificationPreferences'}
    PreferencesPatch:
      type: object
      additionalProperties: false
      properties:
        appearance:
          type: object
          additionalProperties: false
          properties:
            theme: {type: string, enum: [light, dark, system]}
            fontScale: {type: integer, enum: [100, 112, 125]}
            reduceMotion: {type: boolean}
            density: {type: string, enum: [comfortable, compact]}
        feed:
          type: object
          additionalProperties: false
          properties:
            mode: {type: string, enum: [for_me, following]}
            topicWeight: {type: number, minimum: 0, maximum: 100}
            linkWeight: {type: number, minimum: 0, maximum: 100}
            discoveryWeight: {type: number, minimum: 0, maximum: 100}
            recencyWeight: {type: number, minimum: 0, maximum: 100}
            excludedTopics: {type: array, maxItems: 100, uniqueItems: true, items: {type: string, minLength: 1, maxLength: 50}}
            showReasons: {type: boolean}
        notifications:
          type: object
          additionalProperties: false
          properties:
            inApp:
              type: object
              additionalProperties: false
              properties:
                mentions: {type: boolean}
                signals: {type: boolean}
                follows: {type: boolean}
                echoes: {type: boolean}
                approvals: {type: boolean, description: 입력값과 관계없이 운영상 필수 알림으로 true가 저장·반환됩니다.}
            toast: {$ref: '#/components/schemas/NotificationChannelPreferencesPatch'}
            desktop: {$ref: '#/components/schemas/NotificationChannelPreferencesPatch'}
            email: {$ref: '#/components/schemas/NotificationChannelPreferencesPatch'}
            digest:
              type: object
              additionalProperties: false
              description: mode 또는 daily time 변경은 worker가 변경을 감지한 시각부터 새 집계 구간을 시작하며 이전 일정의 backlog를 재생하지 않습니다.
              properties:
                mode: {type: string, enum: [off, hourly, daily]}
                time: {$ref: '#/components/schemas/ClockTime'}
            quietHours:
              type: object
              additionalProperties: false
              properties:
                enabled: {type: boolean}
                start: {$ref: '#/components/schemas/ClockTime'}
                end: {$ref: '#/components/schemas/ClockTime'}
    AppearancePreferences:
      type: object
      additionalProperties: false
      required: [theme, fontScale, reduceMotion, density]
      properties:
        theme: {type: string, enum: [light, dark, system]}
        fontScale: {type: integer, enum: [100, 112, 125]}
        reduceMotion: {type: boolean}
        density: {type: string, enum: [comfortable, compact]}
    FeedPreferences:
      type: object
      additionalProperties: false
      required: [mode, topicWeight, linkWeight, discoveryWeight, recencyWeight, excludedTopics, showReasons]
      properties:
        mode: {type: string, enum: [for_me, following]}
        topicWeight: {type: number, minimum: 0, maximum: 100}
        linkWeight: {type: number, minimum: 0, maximum: 100}
        discoveryWeight: {type: number, minimum: 0, maximum: 100}
        recencyWeight: {type: number, minimum: 0, maximum: 100}
        excludedTopics: {type: array, maxItems: 100, uniqueItems: true, items: {type: string, minLength: 1, maxLength: 50}}
        showReasons: {type: boolean}
    NotificationPreferences:
      type: object
      additionalProperties: false
      required: [inApp, toast, desktop, email, digest, quietHours]
      properties:
        inApp:
          type: object
          additionalProperties: false
          required: [mentions, signals, follows, echoes, approvals]
          properties:
            mentions: {type: boolean}
            signals: {type: boolean}
            follows: {type: boolean}
            echoes: {type: boolean}
            approvals: {type: boolean, const: true, description: 승인·보안 운영 알림은 끌 수 없습니다.}
        toast: {$ref: '#/components/schemas/NotificationChannelPreferences'}
        desktop: {$ref: '#/components/schemas/NotificationChannelPreferences'}
        email: {$ref: '#/components/schemas/NotificationChannelPreferences'}
        digest:
          type: object
          additionalProperties: false
          description: mode 또는 daily time 변경은 worker가 변경을 감지한 시각부터 새 집계 구간을 시작하며 이전 일정의 backlog를 재생하지 않습니다.
          required: [mode, time]
          properties:
            mode: {type: string, enum: [off, hourly, daily]}
            time: {$ref: '#/components/schemas/ClockTime'}
        quietHours:
          type: object
          additionalProperties: false
          required: [enabled, start, end]
          properties:
            enabled: {type: boolean}
            start: {$ref: '#/components/schemas/ClockTime'}
            end: {$ref: '#/components/schemas/ClockTime'}
    NotificationChannelPreferences:
      type: object
      additionalProperties: false
      required: [enabled]
      properties:
        enabled: {type: boolean}
    NotificationChannelPreferencesPatch:
      type: object
      additionalProperties: false
      properties:
        enabled: {type: boolean}
    NotificationEmailStatus:
      type: object
      additionalProperties: false
      required: [available, smtpConfigured, recipientConfigured]
      properties:
        available: {type: boolean, description: SMTP가 활성화되고 현재 사용자의 수신 이메일이 올바를 때 true}
        smtpConfigured: {type: boolean}
        recipientConfigured: {type: boolean}
    ClockTime:
      type: string
      pattern: '^(?:[01][0-9]|2[0-3]):[0-5][0-9]$'
      examples: ['08:00']
    User:
      type: object
      required: [id, username, displayName, roles, active]
      properties:
        id: {type: string}
        username: {type: string}
        displayName: {type: string}
        email: {type: string}
        bio: {type: string}
        avatarId: {type: string}
        avatarUrl: {type: string}
        accountType: {type: string, enum: [human, agent]}
        provider: {type: string}
        roles: {type: array, items: {type: string}}
        active: {type: boolean}
        followerCount: {type: integer, minimum: 0}
        followingCount: {type: integer, minimum: 0}
        moinCount: {type: integer, minimum: 0, description: 공개·게시 Moin 수}
        signal: {type: integer, minimum: 0, description: 공개·게시 Moin이 받은 Signal 수}
        followed: {type: boolean}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    Post:
      type: object
      required: [id, content, visibility, createdAt]
      properties:
        id: {type: string}
        author: {$ref: '#/components/schemas/User'}
        content: {type: string}
        visibility: {type: string, enum: [public, followers, moim]}
        replyToId: {type: string}
        quoteMoinId: {type: string}
        moimId: {type: string, description: 모임 전용 Moin에 필요한 가입 Moim ID. 모임 Moin의 파생 게시물은 부모 값으로 강제됩니다.}
        media: {type: array, items: {$ref: '#/components/schemas/Media'}}
        topics: {type: array, items: {type: object, additionalProperties: true}}
        counts: {type: object, additionalProperties: {type: integer}}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    CreatePost:
      type: object
      additionalProperties: false
      required: [content]
      properties:
        content: {type: string, minLength: 1, maxLength: 5000}
        visibility: {type: string, enum: [public, followers, moim]}
        mediaIds: {type: array, maxItems: 12, uniqueItems: true, items: {type: string}}
        mediaAltTexts:
          type: object
          maxProperties: 12
          propertyNames: {type: string, minLength: 1}
          additionalProperties: {type: string, maxLength: 500}
          description: mediaIds에 포함된 ID별 최종 접근성 대체 텍스트
        replyToId: {type: string}
        quoteMoinId: {type: string}
        moimId: {type: string, description: 가입한 모임에 새 Moin을 쓸 때 visibility=moim과 함께 지정합니다. 파생 게시물은 부모 값으로 강제됩니다.}
    CreateMoim:
      type: object
      additionalProperties: false
      required: [name, slug]
      properties:
        name: {type: string, minLength: 1, maxLength: 80}
        slug: {type: string, pattern: '^[a-z0-9][a-z0-9-]{2,49}$'}
        description: {type: string, maxLength: 1000}
        visibility: {type: string, enum: [public, private]}
    Media:
      type: object
      required: [id, filename, mimeType, size, createdAt]
      properties:
        id: {type: string}
        ownerId: {type: string}
        filename: {type: string}
        altText: {type: string, maxLength: 500, description: Moin 응답에서는 post_media 관계의 문맥 대체 텍스트이고 upload 응답에서는 새 연결의 기본값입니다.}
        mimeType: {type: string, examples: [image/webp, video/mp4]}
        type: {type: string, enum: [image, video]}
        url: {type: string}
        size: {type: integer, format: int64, minimum: 1}
        width: {type: integer, minimum: 0}
        height: {type: integer, minimum: 0}
        createdAt: {type: string, format: date-time}
    Notification:
      type: object
      additionalProperties: false
      required: [id, type, payload, inApp, toast, desktop, createdAt]
      properties:
        id: {type: string}
        userId: {type: string}
        actorId: {type: string}
        type: {type: string, examples: [follow, signal, echo, mention, approval_requested, digest]}
        targetId: {type: string}
        payload: {type: object, additionalProperties: true}
        title: {type: string}
        body: {type: string}
        actor: {type: object, additionalProperties: true}
        targetPath: {type: string, pattern: '^/'}
        inApp: {type: boolean, description: 알림 센터에 노출하고 미확인 수에 포함할지 여부. false row는 이미 읽은 숨김 전달 기록으로 보관됩니다.}
        toast: {type: boolean, description: 현재 event를 앱 Toast로 표시할지 여부. 조용한 시간과 Digest 정책을 반영합니다.}
        desktop: {type: boolean, description: 현재 event를 Browser Notification으로 표시할지 여부. 브라우저 권한은 별도로 필요합니다.}
        readAt: {type: [string, 'null'], format: date-time}
        createdAt: {type: string, format: date-time}
    GeneralConfig:
      type: object
      additionalProperties: false
      required: [serviceName, allowRegistration, sessionMinutes, defaultTimezone]
      properties:
        serviceName: {type: string, minLength: 1, maxLength: 80}
        allowRegistration: {type: boolean}
        sessionMinutes: {type: integer, minimum: 5, maximum: 1440}
        defaultTimezone: {type: string, examples: [Asia/Seoul]}
    APIAccessConfig:
      type: object
      additionalProperties: false
      required: [enabled, mcpEnabled, rateLimitPerMinute]
      properties:
        enabled: {type: boolean}
        mcpEnabled: {type: boolean}
        rateLimitPerMinute: {type: integer, minimum: 1, maximum: 10000}
    MediaConfig:
      type: object
      additionalProperties: false
      properties:
        maxUploadBytes: {type: integer, format: int64, minimum: 65536, maximum: 52428800, default: 10485760}
        maxPerPost: {type: integer, minimum: 1, maximum: 12, default: 4}
        orphanTtlHours: {type: integer, minimum: 1, maximum: 720, default: 24, description: Moin·프로필에 연결되지 않은 업로드 보존 시간}
    NetworkProxyConfig:
      type: object
      additionalProperties: false
      required: [trustedProxies]
      properties:
        trustedProxies:
          type: array
          maxItems: 128
          uniqueItems: true
          description: 직접 연결 Peer로 신뢰할 정확한 IP 또는 CIDR. 목록이 비어 있으면 Forwarded·X-Forwarded 헤더를 모두 무시합니다. Client chain과 protocol은 가장 가까운 오른쪽 hop부터 검증합니다.
          items: {type: string, examples: [10.20.0.10, 10.30.0.0/24]}
    WorkflowActionPattern:
      type: string
      description: 현재 실행 가능한 post.publish를 포함하는 전역 `*`, exact action, 또는 마지막 segment wildcard `post.*`. 입력은 소문자로 정규화됩니다. 문법상 유효해도 현재 승인 요청 producer가 없는 action은 거부합니다.
      pattern: '^(?:\*|[A-Za-z][A-Za-z0-9_-]*(?:\.[A-Za-z][A-Za-z0-9_-]*)*\.\*|[A-Za-z][A-Za-z0-9_-]*(?:\.[A-Za-z][A-Za-z0-9_-]*)+)$'
      examples: ['*', post.publish, 'post.*']
    WorkflowConfig:
      type: object
      additionalProperties: false
      required: [enabled, actions, approverRoles]
      properties:
        enabled: {type: boolean}
        actions: {type: array, maxItems: 128, uniqueItems: true, items: {$ref: '#/components/schemas/WorkflowActionPattern'}, description: enabled=true인데 비어 있으면 post.publish가 저장됩니다.}
        approverRoles: {type: array, maxItems: 32, uniqueItems: true, items: {type: string, minLength: 1}, description: 비어 있으면 기본 팀장·관리자 역할이 적용됩니다. 모든 역할이 최종 유효 권한으로 approvals:review를 가져야 합니다.}
    MediaClientConfig:
      type: object
      additionalProperties: false
      required: [maxUploadBytes, maxPerPost, acceptedTypes]
      properties:
        maxUploadBytes: {type: integer, format: int64, minimum: 65536, maximum: 52428800, description: 파일 한 개의 현재 최대 byte 수}
        maxPerPost: {type: integer, minimum: 1, maximum: 12, description: Moin 하나에 연결할 수 있는 현재 최대 media 수}
        acceptedTypes:
          type: array
          minItems: 6
          maxItems: 6
          uniqueItems: true
          description: 업로드 검사에서 허용하는 MIME type
          items: {type: string, enum: [image/jpeg, image/png, image/gif, image/webp, video/mp4, video/webm]}
    AllowedHosts:
      type: array
      maxItems: 64
      uniqueItems: true
      description: |
        exact DNS 이름/IP 또는 선택적 host:port. port 없는 항목은 URL scheme의 기본 port
        (HTTPS 443, HTTP 80)에만 일치하며 비기본 port는 host:port로 명시해야 합니다.
        scheme·경로·userinfo·wildcard는 허용하지 않습니다.
      items: {type: string, minLength: 1, maxLength: 255, examples: [keycloak.internal, 'ai.internal:8443']}
    PrivateAllowedHosts:
      type: array
      maxItems: 64
      uniqueItems: true
      description: |
        allowedHosts에도 같은 authority로 등록된 정확한 DNS hostname만 지정합니다. 이 목록의 hostname은
        DNS가 RFC1918 IPv4 또는 ULA IPv6를 반환해도 연결할 수 있습니다. port 없는 항목은 scheme 기본
        port에만 일치하고 비기본 port는 host:port로 명시합니다. IP literal, wildcard, scheme, 경로와
        userinfo는 허용하지 않습니다. loopback·link-local·cloud metadata·CGNAT·unspecified·multicast
        주소는 이 목록에 있어도 항상 차단됩니다. v0.1.0의 기존 사설 OIDC·AI host는 이 목록으로
        자동 이관되지 않으며 로컬 bootstrap 최고 관리자가 업그레이드 후 명시 저장해야 합니다.
      items: {type: string, minLength: 1, maxLength: 255, examples: [keycloak.internal, 'ai.internal:8443']}
    OIDCConfigBase:
      type: object
      properties:
        enabled: {type: boolean}
        issuerUrl: {type: string, format: uri, description: discovery 문서 issuer와 trailing slash까지 정확히 일치하는 식별자}
        clientId: {type: string}
        redirectUrl: {type: string, format: uri, description: 고급 직접 지정값. 비우면 publicBaseUrl 또는 신뢰된 현재 요청 origin에 고정 callback path를 붙여 계산합니다.}
        scopes: {type: array, maxItems: 20, items: {type: string}, default: [openid, profile, email]}
        autoProvision: {type: boolean, default: true}
        defaultRoles: {type: array, maxItems: 20, items: {type: string}, default: [member]}
        roleClaim: {type: string, default: realm_access.roles}
        roleMappings:
          type: object
          maxProperties: 100
          additionalProperties: {type: array, items: {type: string}}
        allowedHosts: {$ref: '#/components/schemas/AllowedHosts'}
        privateAllowedHosts: {$ref: '#/components/schemas/PrivateAllowedHosts'}
        allowInsecureHttp: {type: boolean, default: false, description: allowedHosts와 privateAllowedHosts에 명시된 폐쇄망 HTTP endpoint에만 사용}
    OIDCConfigInput:
      unevaluatedProperties: false
      allOf:
        - {$ref: '#/components/schemas/OIDCConfigBase'}
        - type: object
          properties:
            clientSecret: {type: string, writeOnly: true, description: Confidential client의 secret. 빈 값이면 기존 secret 유지}
            clearClientSecret: {type: boolean, default: false, writeOnly: true, description: Public client로 전환할 때 저장된 secret을 명시적으로 삭제}
    OIDCConfigView:
      unevaluatedProperties: false
      allOf:
        - {$ref: '#/components/schemas/OIDCConfigBase'}
        - type: object
          properties:
            clientSecretConfigured: {type: boolean}
            effectiveRedirectUrl: {type: string, format: uri, readOnly: true, description: OIDC 전용 redirectUrl, 사이트 publicBaseUrl, 현재 요청 주소 순으로 계산한 실제 callback}
            defaultRedirectUrl: {type: string, format: uri, readOnly: true, description: 직접 지정 redirectUrl을 제거했을 때 사용할 사이트 기본 callback}
            redirectUrlSource: {type: string, enum: [explicit, publicBaseUrl, request], readOnly: true, description: effectiveRedirectUrl의 출처}
            defaultRedirectUrlSource: {type: string, enum: [publicBaseUrl, request], readOnly: true, description: defaultRedirectUrl의 출처}
    AIConfigBase:
      type: object
      properties:
        enabled: {type: boolean}
        baseUrl: {type: string, format: uri}
        model: {type: string}
        apiStyle: {type: string, enum: [responses, chat_completions], default: responses}
        defaultMaxTokens: {type: integer, minimum: 1, maximum: 262144, default: 4096}
        maxTokens: {type: integer, minimum: 1, maximum: 262144, default: 262144}
        timeoutSeconds: {type: integer, minimum: 10, maximum: 3600, default: 300}
        allowedHosts: {$ref: '#/components/schemas/AllowedHosts'}
        privateAllowedHosts: {$ref: '#/components/schemas/PrivateAllowedHosts'}
        allowInsecureHttp: {type: boolean, default: false, description: allowedHosts와 privateAllowedHosts에 명시된 폐쇄망 HTTP endpoint에만 사용}
    AIConfigInput:
      unevaluatedProperties: false
      allOf:
        - {$ref: '#/components/schemas/AIConfigBase'}
        - type: object
          properties:
            apiKey: {type: string, writeOnly: true, description: 빈 값이면 기존 key 유지}
            clearApiKey: {type: boolean, default: false, writeOnly: true}
    AIConfigView:
      unevaluatedProperties: false
      allOf:
        - {$ref: '#/components/schemas/AIConfigBase'}
        - type: object
          properties:
            apiKeyConfigured: {type: boolean}
    SMTPConfigBase:
      type: object
      required: [enabled, host, port, security, username, fromAddress, fromName, timeoutSeconds, allowPrivateNetwork]
      properties:
        enabled: {type: boolean}
        host: {type: string, maxLength: 253, description: port 없는 정확한 DNS 이름 또는 공개 IP. 사설망 opt-in은 DNS 이름만 허용합니다.}
        port: {type: integer, minimum: 1, maximum: 65535, default: 587}
        security: {type: string, enum: [starttls, tls, none], default: starttls, description: none은 폐쇄망의 무인증 SMTP에서만 사용할 수 있습니다.}
        username: {type: string, maxLength: 320}
        fromAddress: {type: string, format: email, maxLength: 320}
        fromName: {type: string, maxLength: 80}
        timeoutSeconds: {type: integer, minimum: 3, maximum: 60, default: 15}
        allowPrivateNetwork: {type: boolean, default: false, description: host와 port로 지정한 정확한 DNS authority만 RFC1918·ULA 연결을 허용합니다.}
    SMTPConfigInput:
      unevaluatedProperties: false
      allOf:
        - {$ref: '#/components/schemas/SMTPConfigBase'}
        - type: object
          properties:
            password: {type: string, maxLength: 4096, writeOnly: true, description: 빈 값이면 기존 password 유지}
            clearPassword: {type: boolean, default: false, writeOnly: true, description: 저장된 password를 명시적으로 삭제}
    SMTPConfigView:
      unevaluatedProperties: false
      allOf:
        - {$ref: '#/components/schemas/SMTPConfigBase'}
        - type: object
          properties:
            passwordConfigured: {type: boolean, readOnly: true}
    DeadLetterEvent:
      type: object
      required: [id, type, aggregateId, attempts, maxAttempts, lastError, createdAt, deadLetteredAt]
      properties:
        id: {type: string}
        type: {type: string}
        aggregateId: {type: string}
        attempts: {type: integer, minimum: 1}
        maxAttempts: {type: integer, minimum: 1}
        payload: {description: 이벤트 처리용 JSON payload. audit 권한으로 보호하며 관리자 UI는 원문을 표시하지 않습니다.}
        lastError: {type: string, maxLength: 4000}
        lastAttemptAt: {type: [string, 'null'], format: date-time}
        createdAt: {type: string, format: date-time}
        deadLetteredAt: {type: string, format: date-time}
    Error:
      type: object
      required: [code, message]
      properties:
        code: {type: string}
        message: {type: string}
        details: {description: 권한으로 보호된 일부 관리자 진단 API가 제공하는 구조화된 해결 정보}
    OIDCPolicyDiagnostic:
      type: object
      additionalProperties: false
      required: [stage, action, canAllowPrivate]
      properties:
        stage: {type: string, enum: [discovery, discovery_endpoint, authorization_endpoint, token_endpoint]}
        targetHost: {type: string, description: OIDC Host 입력란에 그대로 사용할 정확한 hostname 또는 host:port}
        resolvedAddresses: {type: array, items: {type: string}, description: settings:manage 권한의 연결 테스트에만 반환되는 MOINA 컨테이너 DNS 결과}
        addressReason: {type: string}
        action: {type: string, enum: [add_allowed_host, add_private_host, change_dns_or_endpoint, review_network_policy]}
        canAllowPrivate: {type: boolean}
    JSONRPCRequest:
      type: object
      required: [jsonrpc, method]
      properties:
        jsonrpc: {const: '2.0'}
        id: {type: [string, integer, 'null']}
        method: {type: string}
        params: {type: object, additionalProperties: true}
    JSONRPCResponse:
      type: object
      required: [jsonrpc]
      properties:
        jsonrpc: {const: '2.0'}
        id: {type: [string, integer, 'null']}
        result: {}
        error: {type: object, additionalProperties: true}
  pathItems:
    AdminRead:
      tags: [Admin]
      summary: 관리자 조회
      responses: {'200': {$ref: '#/components/responses/Data'}, '403': {$ref: '#/components/responses/Error'}}
    AdminWrite:
      tags: [Admin]
      summary: 관리자 설정 변경
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      requestBody: {$ref: '#/components/requestBodies/Object'}
      responses: {'200': {$ref: '#/components/responses/Data'}, '403': {$ref: '#/components/responses/Error'}}
    AdminAction:
      tags: [Admin]
      summary: 관리자 연결 테스트
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      requestBody: {$ref: '#/components/requestBodies/OptionalObject'}
      responses: {'200': {$ref: '#/components/responses/Data'}, '400': {$ref: '#/components/responses/Error'}}
security:
  - cookieAuth: []
  - bearerAuth: []
